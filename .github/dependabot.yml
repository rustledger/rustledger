version: 2
updates:
  # Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      # init and analyze are two actions in the same github/codeql-action repo
      # and MUST move to the same commit SHA together — mixed versions fail with
      # "Loaded a configuration file for version X, but running version Y". Group
      # them into one PR so Dependabot never bumps one without the other (#1822
      # bumped analyze alone and broke every CodeQL run).
      codeql-action:
        patterns:
          - "github/codeql-action*"
  # npm — MCP server. The MCP spec moves fast, so the SDK pin needs update PRs
  # or it silently rots.
  #
  # NOTE, learned the hard way on #1767: this cannot catch a spec adoption that
  # arrives as a RENAME. The 2026-07-28 spec shipped as new scoped packages
  # (@modelcontextprotocol/server et al.), not as a major bump of
  # @modelcontextprotocol/sdk, and Dependabot tracks versions of a named
  # package, not successors — so no entry here would ever have surfaced it. The
  # comment that used to sit here claimed the opposite. Watch the upstream
  # release notes for a restructure; this entry handles ordinary bumps only.
  - package-ecosystem: "npm"
    directory: "/packages/mcp-server"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
  # npm — VS Code extension.
  - package-ecosystem: "npm"
    directory: "/packages/vscode"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
