# Core CI workflow - runs on every PR
# Fast checks: format, build, lint, test, docs, regressions
#
# Optimization: Skips expensive builds on non-code PRs (docs, CI config, etc.)
# Always runs full build on: release PRs, pushes to main, merge queue
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache
jobs:
  # Detect if code files changed (skip builds on docs-only PRs)
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tests/**'
              - 'spec/**'
              # PR #1228 review flagged this gap: a PR that changes only
              # `scripts/regen-bindings.sh` or the checked-in bindings
              # files used to skip the `bindings-fresh` job. Include
              # them so script-only changes still run the freshness
              # check.
              - 'scripts/regen-bindings.sh'
              - 'crates/rustledger-wasm/bindings/**'
      - name: Decide if build needed
        id: decide
        env:
          CODE_CHANGED: ${{ steps.filter.outputs.code }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Always build on push to main, merge queue, or manual dispatch
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Non-PR event ($EVENT_NAME) - will build"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Always build on release PRs
          if [[ "$HEAD_REF" == release/* ]]; then
            echo "Release PR detected - will build"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build if code changed
          if [[ "$CODE_CHANGED" == "true" ]]; then
            echo "Code changes detected - will build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "No code changes - skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi
  # Fast format check (only on code changes)
  fmt:
    name: Format
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
          components: rustfmt
      - run: cargo fmt --all -- --check
  # Release hygiene: the crates.io publish list in release-publish.yml must
  # match the set of publishable workspace crates. A new crate missing from
  # the array silently breaks `cargo publish` for its dependents mid-release
  # (this is what broke v0.16.0 — rustledger-completion was never added).
  publish-list:
    name: Publish list in sync
    runs-on: ubuntu-latest
    # Only runs `cargo metadata` (no compilation), so the workflow-level sccache
    # wrapper isn't needed (and isn't installed in this job).
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      - name: Verify release-publish CRATES array matches publishable crates
        run: python3 scripts/check-publish-crates.py
  # Wire-format bindings freshness gate (ADR-0004, #1218 + #1232).
  # Regenerates all three artifacts from the Rust DTOs and fails if any
  # differs from the checked-in version:
  #   - crates/rustledger-wasm/bindings/index.d.ts     (TS, ts-rs)
  #   - crates/rustledger-wasm/bindings/index.schema.json (JSON Schema, schemars)
  #   - crates/rustledger-wasm/bindings/types.py       (Python, datamodel-code-generator)
  # Any wire-format field change must come with all three regenerated
  # in the same PR.
  bindings-fresh:
    name: Wire-format bindings freshness
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      # Node for the prettier pass in `scripts/regen-bindings.sh`
      # (#1226). Read from `.nvmrc` to keep the version in one place --
      # matches the convention in `wasm.yml` (single source of truth).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      # Python for the `datamodel-code-generator` invocation that
      # emits `bindings/types.py` (Phase 3, #1232). ubuntu-latest
      # preinstalls `pipx`, so the script's `pipx run` path picks the
      # tool up without an extra `pip install` step. Pinning Python
      # 3.12 (matches `--target-python-version` in the regen script).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # sccache is set as RUSTC_WRAPPER at the workflow level (line 21),
      # so every job that compiles Rust must install the action -- without
      # it, cargo's `-vV` probe fails with "could not execute process
      # sccache" (E2 / ENOENT).
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: bindings
      - name: Regenerate + diff bindings (TS, JSON Schema, Python)
        run: RUSTLEDGER_TS_CHECK=1 scripts/regen-bindings.sh
  # Fast invariant check: verify that crates declaring
  # `#![forbid(unsafe_code)]` contain no `unsafe` blocks/items. Runs in
  # milliseconds via grep, so it fails loudly and early on AI-generated
  # PRs that try to add unsafe to a forbidding crate (see PR #769 for
  # the proximate trigger).
  #
  # `cargo check` also enforces this invariant, but its failure message
  # reads `"usage of an unsafe block"` without mentioning the forbid
  # directive the author is violating. This script prints both the
  # offending line and the forbid directive line in the same error, as
  # a named CI status, so reviewers don't have to hunt for context.
  unsafe-invariant:
    name: Unsafe Invariant
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify forbid-unsafe-code invariant
        run: ./scripts/check-unsafe-invariant.sh

  # Ratchet for the parking_lot adoption (#1076): forbid std::sync Mutex/RwLock
  # in library code so the perf decision can't silently regress. Same
  # lightweight named-status pattern as the unsafe invariant; no extra
  # toolchain required (deliberately a grep ratchet rather than a dylint lint).
  sync-primitives:
    name: Sync Primitives
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid std::sync Mutex/RwLock in library code
        run: ./scripts/check-sync-primitives.sh

  # Ratchet keeping `file:` URI <-> path conversion inside
  # `rustledger-lsp/src/proto.rs` (#1868). Four hand-rolled converters coexisted
  # in that crate, each wrong differently: no encoding at all, spaces only, no
  # decoding on the way back, a Windows separator escaped to %5C. All four
  # agreed on the ASCII paths anyone tests with. Same grep-ratchet, no-extra-
  # toolchain pattern as the unsafe and sync-primitive invariants.
  #
  # No `should_build` gate: the scripts are what is being run, so a PR touching
  # only them must still exercise them.
  uri-boundary:
    name: URI Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the guard (a ratchet whose regex stopped matching says ok forever)
        run: ./scripts/test-uri-boundary.sh
      - name: "Confine file: URI conversion to the boundary module"
        run: ./scripts/check-uri-boundary.sh

  # The ONLY job in this repo that runs `cargo test` off Linux.
  #
  # `rustledger-lsp` is where platform-specific path handling actually lives:
  # `url::Url::from_file_path` decides what is absolute using the HOST
  # platform's rules, so the drive-letter and UNC shapes cannot be faked on
  # Linux — asserting a hand-written `C:/x` there tests a shape the code never
  # receives, which is how the backslash bug in #1867 got through. The tests
  # were therefore written `#[cfg(windows)]`, and then ran nowhere at all: the
  # only `windows-latest` jobs in this repo download a published binary and run
  # `rledger check`, so no Windows `cargo test` existed. A `cfg` that nothing
  # compiles is an assertion nobody makes.
  #
  # Scoped to the one crate rather than the workspace: this is about path/URI
  # conversion, and a full cross-platform workspace run is a much larger
  # commitment than the problem needs.
  #
  # macOS covers a DIFFERENT axis than Windows. Its filesystem is
  # case-insensitive but case-PRESERVING, so `/Users/rob/Ledger.beancount` and
  # `/users/rob/ledger.beancount` are one file with two paths that compare
  # unequal — the same "a string is not an identity" failure the diagnostics
  # cache had, on a platform where paths look POSIX and every other Linux
  # assumption holds. Windows cannot surface that one: its separator and drive
  # differences make such tests fail loudly rather than pass quietly.
  lsp-platform:
    name: LSP (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform's failure must not hide the other's
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      # Required: sccache is RUSTC_WRAPPER at the workflow level, so a job that
      # compiles Rust without installing it dies on cargo's `-vV` probe with
      # "could not execute process sccache" — which is how this job failed the
      # first time it ran.
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      - name: Test rustledger-lsp on Windows
        run: cargo test -p rustledger-lsp

  # Build + test the MCP server. Nothing did, until now.
  #
  # `packages/mcp-server` is published to npm as `@rustledger/mcp-server` and
  # was covered by no PR job at all — only the release workflows touched it. An
  # SDK MAJOR migration (#1879, monolithic `@modelcontextprotocol/sdk` v1 to the
  # scoped v2 packages) went through with zero automated verification; it was
  # checked by hand, which does not scale and does not repeat.
  #
  # No `should_build` gate: that filter is for Rust sources, and this package
  # is TypeScript. Path-filtering on `packages/mcp-server/**` was tempting but
  # would miss the case that actually bites — the server calls into
  # `@rustledger/wasm`, so a Rust change can break it without touching a single
  # file here.
  mcp-server:
    name: MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/mcp-server/package-lock.json
      - name: Install
        working-directory: packages/mcp-server
        run: npm ci
      - name: Typecheck and build
        working-directory: packages/mcp-server
        run: npm run build
      - name: Test
        working-directory: packages/mcp-server
        run: npm test
      - name: Smoke the stdio server
        working-directory: packages/mcp-server
        run: |
          # A green build does not mean the server speaks the protocol. This
          # drives the real binary over stdio in BOTH negotiation directions,
          # which is what the SDK v2 migration had to be checked by hand for.
          set -euo pipefail
          probe() {
            local label="$1"; shift
            local out
            out=$(printf '%s\n' "$@" | timeout 60 node dist/index.js 2>/dev/null || true)
            node -e '
              const lines = require("fs").readFileSync(0, "utf8").trim().split("\n").filter(Boolean);
              const msgs = lines.map(l => JSON.parse(l));
              const err = msgs.find(m => m.error);
              if (err) { console.error("  '"$label"': JSON-RPC error " + JSON.stringify(err.error)); process.exit(1); }
              const tools = msgs.find(m => m.result && m.result.tools);
              if (!tools || tools.result.tools.length === 0) { console.error("  '"$label"': no tools listed"); process.exit(1); }
              console.log("  '"$label"': ok, " + tools.result.tools.length + " tools");
            ' <<< "$out"
          }
          # A pre-2026 client: full initialize handshake.
          probe "legacy handshake" \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          # A 2026-07-28 client: stateless, no handshake at all.
          probe "stateless" \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'

  # Plugin-test policies (Phase 5 of plugin-testing-quality plan, see #992).
  # Catches weak count assertions and `(partial)` test ports that tend to
  # silently mask plugin bugs.
  #
  # Always runs (no `should_build` gate), because the policy script and
  # CONTRIBUTING.md changes themselves can land in docs-only PRs and we
  # still want to lint the test files against the current policy.
  plugin-test-quality:
    name: Plugin Test Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the lint script (catches regressions in the regexes)
        run: ./scripts/test-plugin-test-quality.sh
      - name: Run plugin-test-quality lints
        run: ./scripts/check-plugin-test-quality.sh
      - name: Self-test the per-plugin mutation report script
        run: ./scripts/test-per-plugin-mutation-report.sh

  # Ratchet for the FxHasher adoption on hot paths (#1076): modules marked
  # `// ratchet: fxhash-only` must not use std SipHash HashMap/HashSet, which
  # would silently regress the perf decision. Grep ratchet, no extra toolchain
  # (#1237). Same lightweight named-status pattern as the unsafe invariant.
  hot-path-collections:
    name: Hot-path Collections
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid std SipHash collections in fxhash-only modules
        run: ./scripts/check-hot-path-collections.sh

  # Public-API SemVer ratchet for the plugin DTOs (#1233, Tier 1).
  # `rustledger-plugin-types` is what every plugin author compiles against —
  # an accidental breaking change (a renamed pub field, a changed trait
  # signature, a pub enum variant added without `#[non_exhaustive]`) would
  # ship in the published crate and break every plugin. cargo-semver-checks
  # compares the current public API against the last crates.io release (the
  # crate is published by release-publish.yml) and fails on an unmarked
  # SemVer-major break. The action manages the nightly toolchain rustdoc
  # JSON needs, so no nightly is added to the flake.
  #
  # ADVISORY for now: this job is deliberately NOT part of the `build` merge
  # gate, so it surfaces breaks without blocking. Promote it to required
  # (add to the `build` aggregator or branch protection) once it has proven
  # stable on real PRs. Tier 1 = plugin-types only; expand to core/parser
  # later.
  #
  # Runs on EVERY PR (no `should_build` gate): the semver check must always
  # report so it (a) self-validates on workflow-only PRs and (b) can be
  # promoted to a required check later without a skipped run blocking
  # config-only PRs forever (a skipped required check never goes green).
  #
  # Env overrides: RUSTC_WRAPPER is cleared because the workflow sets it to
  # sccache globally (line ~21) and this job does not install the
  # sccache-action; RUSTFLAGS is cleared so nightly-rustdoc warning churn
  # can't red the ratchet for reasons unrelated to a SemVer break.
  semver-plugin-types:
    name: SemVer (plugin-types)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ''
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check rustledger-plugin-types public API for SemVer breaks
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: rustledger-plugin-types

  # Main CI matrix - check, clippy, test, doc (only on code changes)
  ci:
    name: ${{ matrix.name }}
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      RUST_MIN_STACK: 8388608
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Check
            cmd: cargo check --all-features --all-targets
            components: ""
          - name: Clippy
            cmd: cargo clippy --all-features --all-targets -- -D warnings
            components: clippy
          - name: Test
            cmd: cargo nextest run --all-features
            components: ""
            install: nextest
          - name: Documentation
            cmd: cargo doc --all-features --no-deps
            components: ""
            env: RUSTDOCFLAGS=-Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
          components: ${{ matrix.components }}
          # wasm32 needed by rustledger-importer's build.rs (which
          # compiles the sample_stub fixture for the wasm_importer_e2e
          # test). Without it, build.rs gracefully skips and the e2e
          # test silently passes without doing anything — see PR #1135
          # commit history.
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      - name: Install nextest
        if: matrix.install == 'nextest'
        uses: taiki-e/install-action@7be9fd86bd1707236395105d6e9329dd1511a7e1 # v2.79.0
        with:
          tool: cargo-nextest
        continue-on-error: true
        id: install-nextest
      - name: Install nextest (fallback)
        if: matrix.install == 'nextest' && steps.install-nextest.outcome == 'failure'
        run: cargo install cargo-nextest --locked
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}
        env:
          RUSTDOCFLAGS: ${{ matrix.env == 'RUSTDOCFLAGS=-Dwarnings' && '-Dwarnings' || '' }}
  # Doctests (nextest doesn't support them, only on code changes)
  doctest:
    name: Doctests
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      RUST_MIN_STACK: 8388608
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      - name: Run doctests
        run: cargo test --doc --all-features
  # Regression tests - user-reported issues (only on code changes)
  regressions:
    name: Regression Tests
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      - name: Build rledger
        run: cargo build --release --bin rledger
      - name: Run regression tests
        run: ./scripts/test-regressions.sh ./target/release/rledger
      - name: Summary
        run: |
          echo "## Regression Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tested beancount files from user-reported issues:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in tests/regressions/issue-*.beancount; do
            issue=$(basename "$f" .beancount | sed 's/issue-//')
            echo "- [#$issue](https://github.com/rustledger/rustledger/issues/$issue)" >> $GITHUB_STEP_SUMMARY
          done
  # Criterion benches must keep COMPILING so they don't bitrot. Nothing else
  # builds them: `bench-pr.yml` runs a separate custom timing benchmark, and
  # ci.yml never referenced the criterion targets despite a stale comment in
  # `bench-pr.yml` claiming it did. We compile only (`--no-run`) — running the
  # benches on shared CI runners is timing-noisy and adds no gating value; the
  # real risk this guards is a source change silently breaking a bench build.
  bench-build:
    name: Benchmarks Compile
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      # `cargo bench` compiles the lib WITHOUT its `#[test]` fns (only `#[bench]`
      # + the lib), so test-only helpers used solely by `#[test]` look dead here
      # and the workflow-wide `-Dwarnings` (env above) would fail the gate on
      # incidental dead-code — not a bench-compile problem. Cap lints to `warn`
      # so this job checks *compilation* only; clippy / `ci` lint the real
      # targets. A genuine compile error still fails (cap-lints affects lints).
      - name: Compile all criterion benches (--no-run)
        env:
          RUSTFLAGS: "--cap-lints=warn"
        run: cargo bench --workspace --no-run
  # Slim-build ratchet (#1427/#867): `cargo install rustledger
  # --no-default-features` must stay wasmtime/cranelift-free so the minimal
  # native binary builds on platforms where cranelift can't (e.g. Termux). Two
  # regressions shipped without this guard; the script fails if `wasmtime`
  # re-enters the no-default dependency tree.
  slim-build-no-wasmtime:
    name: Slim Build (no wasmtime)
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      - name: Forbid wasmtime in --no-default-features build
        run: ./scripts/check-slim-no-wasmtime.sh

  # WIT/Component-Model parity (#1384/#1402). The `rustledger-ffi-component-tests`
  # tests SKIP unless the wasip2 artifact exists, and the `Test` job above never
  # builds it — so without this job the entire component surface is unverified by
  # CI. Build the component for wasm32-wasip2 first, then run the parity harness
  # so the tests actually execute.
  component-parity:
    name: Component Parity (wasip2)
    needs: [changes]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
          targets: wasm32-wasip2
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      - name: Build the wasip2 component
        run: cargo build -p rustledger-ffi-component --target wasm32-wasip2
      # The parity tests gracefully skip when the component artifact is
      # missing (so plain `cargo test` works locally without a wasip2
      # build). In THIS job the build step just produced it, so a skip
      # means artifact-path drift — fail loudly instead of passing green
      # on zero assertions (availability-gated-tests rule, CLAUDE.md).
      - name: Run parity tests
        run: |
          cargo test -p rustledger-ffi-component-tests -- --nocapture 2>&1 | tee parity-output.log
          if grep -q "skip: component wasm not built" parity-output.log; then
            echo "::error::parity tests skipped despite the component being built — artifact path drift"
            exit 1
          fi

  # Wire-contract version gate (#1395). The Component-Model `world.wit` is the
  # versioned wire contract that replaced the hand-parsed FFI-WASI JSON format
  # (#1384). An interface change must bump `package rustledger:ledger@X.Y.Z;` so
  # a wire-shape change can't ship silently — the failure that pinned rustfava
  # to v0.11 for five releases (the v0.16 cost-number break).
  #
  # Runs on EVERY PR (no `should_build` gate) so it self-validates and stays a
  # meaningful required check; the script no-ops when the WIT interface is
  # unchanged (comments/whitespace ignored), so non-WIT PRs pass trivially.
  wit-version-gate:
    name: WIT Version Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: WIT interface change requires a package-version bump
        run: ./scripts/check-wit-version-bump.sh "${{ github.event.pull_request.base.sha }}"

  # Gate job - all core checks must pass (or be skipped on non-code PRs)
  build:
    name: build
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, fmt, unsafe-invariant, sync-primitives, hot-path-collections, plugin-test-quality, uri-boundary, lsp-platform, mcp-server, ci, doctest, regressions, bench-build, bindings-fresh, component-parity, wit-version-gate]
    steps:
      - name: Check results
        run: |
          # plugin-test-quality always runs (no should_build gate), so its
          # result is always required.
          plugin_quality="${{ needs.plugin-test-quality.result }}"
          echo "plugin-test-quality result: $plugin_quality"
          if [[ "$plugin_quality" != "success" ]]; then
            echo "plugin-test-quality must pass"
            exit 1
          fi

          # wit-version-gate always runs (no should_build gate), so its result
          # is always required — a WIT contract change must bump the version.
          wit_gate="${{ needs.wit-version-gate.result }}"
          echo "wit-version-gate result: $wit_gate"
          if [[ "$wit_gate" != "success" ]]; then
            echo "wit-version-gate must pass"
            exit 1
          fi

          # uri-boundary always runs (no should_build gate, because the
          # scripts it runs are themselves what a PR may be changing), so its
          # result is always required. It was advisory when first added, which
          # meant the ratchet could report a violation and the PR would still
          # be mergeable — a ratchet nobody has to satisfy is documentation.
          uri_boundary="${{ needs.uri-boundary.result }}"
          echo "uri-boundary result: $uri_boundary"
          if [[ "$uri_boundary" != "success" ]]; then
            echo "uri-boundary must pass"
            exit 1
          fi

          # mcp-server always runs (no should_build gate — it is a TypeScript
          # package, and a Rust change can break it through @rustledger/wasm
          # without touching it), so its result is always required.
          mcp="${{ needs.mcp-server.result }}"
          echo "mcp-server result: $mcp"
          if [[ "$mcp" != "success" ]]; then
            echo "mcp-server must pass"
            exit 1
          fi

          # If no code changes, the remaining build jobs are skipped - that's OK
          if [[ "${{ needs.changes.outputs.should_build }}" == "false" ]]; then
            echo "No code changes - build skipped (OK)"
            exit 0
          fi

          # Otherwise, check that all jobs passed. bindings-fresh is
          # part of the gate (ADR-0004 Phase 3 / #1232): wire-format
          # drift in the generated TS / JSON Schema / Python artifacts
          # blocks merge just like any other failure.
          # lsp-platform (windows + macos) is in the gate: it found 25 real
          # defects on its first runs, every one of them unreachable from
          # Linux, so a red platform leg must block exactly like a red `ci`.
          results="${{ needs.fmt.result }} ${{ needs.unsafe-invariant.result }} ${{ needs.sync-primitives.result }} ${{ needs.hot-path-collections.result }} ${{ needs.lsp-platform.result }} ${{ needs.ci.result }} ${{ needs.doctest.result }} ${{ needs.regressions.result }} ${{ needs.bench-build.result }} ${{ needs.bindings-fresh.result }} ${{ needs.component-parity.result }}"
          echo "Job results: $results"

          if echo "$results" | grep -qE '(failure|cancelled)'; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi

          echo "All core checks passed!"
