# CodeQL Analysis
# Runs on push to main, PRs, and weekly schedule
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  # Allow manual trigger
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  # Required for uploading SARIF results on PRs
  pull-requests: read
# A new push to a pull request cancels that PR's previous run of this
# workflow: its result is for a commit that can no longer merge, and long jobs
# (mutation shards run up to 4 hours) otherwise hold runners while the new
# commit's required checks queue. Pushes to branches, schedules and manual runs
# are keyed by run id, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.38.0 — MUST match analyze below (mixed versions fail with a config-version error)
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: .github/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.38.0 — MUST match init above
        with:
          category: "/language:${{ matrix.language }}"
  # Gate job - all CodeQL analyses must pass
  codeql:
    name: codeql
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Check all analyses
        run: |
          result="${{ (contains(needs.*.result, 'failure') && 'failure') || (contains(needs.*.result, 'cancelled') && 'cancelled') || 'success' }}"
          echo "CodeQL gate result: $result"
          [[ "$result" == "success" ]] || exit 1
