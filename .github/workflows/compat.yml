# Compatibility workflow - compare rustledger vs Python beancount
#
# Measures compatibility across multiple dimensions:
# 1. Check exit code match (bean-check vs rledger-check)
# 2. AST/Directive comparison (accounts, posting counts, errors)
# 3. Directive type counts (Open, Transaction, Balance, etc.)
# 4. BQL query result match
# 5. Per-category reporting (parser, validation, plugins, etc.)
# 6. Regression detection (newly failing files)
#
name: Compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # Nightly at 3 AM UTC (for historical tracking)
  workflow_dispatch:
    inputs:
      synthetic_seed:
        description: 'Synthetic-generation seed (reproduce a nightly divergence)'
        required: false
        default: ''
        type: string
      synthetic_count:
        description: 'Number of synthetic files to generate'
        required: false
        default: ''
        type: string
# Prevent concurrent runs from racing on the compatibility branch
concurrency:
  group: compatibility-${{ github.event.pull_request.number || 'nightly' }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  compatibility-test:
    name: Run compatibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      # Note: rust-cache intentionally omitted to avoid LGPL-3.0 license check failure.
      # The dependency-review workflow runs from the base branch, so adding LGPL-3.0 to
      # allow-licenses in this PR won't take effect until merged. Nightly builds don't
      # benefit much from caching anyway since they run infrequently.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install beancount beanquery matplotlib pyyaml
          # Third-party plugins used by test files. Compat tests rely on
          # them — a silent install failure means tests using these
          # plugins get skipped and we get false-green CI. Fail loudly
          # if any of these can't install; re-run on transient PyPI flakes.
          pip install beanahead tariochbctools
          pip install beancount_plugin_utils beancount-share
          # Pinned to immutable commits so compat CI is reproducible —
          # tracking HEAD turns unrelated upstream commits into
          # spurious red CI here. Bump deliberately when needed.
          # Bumped to include the box_accrual plugin (added 2025-10-14
          # in commit 6d67ce6cbdb5b36e71e76adb5c741ef6734ec407). The
          # previous pin (41af12d) predated the plugin, so bean-check
          # failed with ModuleNotFoundError on the
          # `beancount_reds_plugins/box_accrual/test.beancount` fixture
          # while rledger (which has a native port) succeeded — the
          # `rust_only_pass` divergence reported in #990 was
          # environmental, not semantic.
          pip install git+https://github.com/redstreet/beancount_reds_plugins@c94911f15ddb8776eac8280e6688ead578aaf344
          pip install git+https://github.com/Evernight/beancount-lazy-plugins@1a685eddbd5e15e420fdf93604506eed6ca94c45
      # Cache downloaded test files to avoid re-cloning repos every run
      - name: Cache compatibility test files
        id: cache-compat-files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/compatibility/files
          # Cache key includes hash of fetch script; v3 removes beancount v2 files with removed plugins
          key: compat-files-v3-${{ hashFiles('scripts/fetch-compat-test-files.sh') }}
          restore-keys: |
            compat-files-v3-
      - name: Fetch compatibility test files
        if: steps.cache-compat-files.outputs.cache-hit != 'true'
        run: |
          echo "Downloading compatibility test files..."
          ./scripts/fetch-compat-test-files.sh
          echo "Downloaded $(find tests/compatibility/files -name '*.beancount' | wc -l) test files"
      - name: Build rustledger
        run: |
          cargo build --release -p rustledger --no-default-features
      - name: Choose synthetic seed and count
        id: synth
        env:
          # Untrusted dispatch inputs enter ONLY via env (never interpolated
          # into the script text) and are validated numeric below — inline
          # `${{ inputs.* }}` in `run:` is a shell-injection vector
          # (review catch).
          INPUT_SEED: ${{ github.event.inputs.synthetic_seed || '' }}
          INPUT_COUNT: ${{ github.event.inputs.synthetic_count || '' }}
        run: |
          # DIFFERENTIAL TESTING: nightly runs use a FRESH seed so the
          # synthetic corpus explores new ledger shapes every night instead
          # of re-checking the same 50 files forever; PR/push runs keep the
          # fixed seed for deterministic, baseline-comparable results.
          # Reproduce any nightly divergence with:
          #   gh workflow run compat.yml -f synthetic_seed=<seed> -f synthetic_count=<count>
          numeric() { [[ "$1" =~ ^[0-9]+$ ]]; }
          if [ -n "$INPUT_SEED" ]; then
            numeric "$INPUT_SEED" || { echo "::error::synthetic_seed must be numeric"; exit 1; }
            SEED="$INPUT_SEED"
            COUNT="${INPUT_COUNT:-500}"
            numeric "$COUNT" || { echo "::error::synthetic_count must be numeric"; exit 1; }
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            SEED="${{ github.run_id }}"
            COUNT=500
          else
            SEED=12345
            COUNT=50
          fi
          printf 'seed=%s\ncount=%s\n' "$SEED" "$COUNT" >> "$GITHUB_OUTPUT"
          {
            printf '## Synthetic corpus\n'
            printf 'seed: `%s` — count: %s (reproduce: `gh workflow run compat.yml -f synthetic_seed=%s -f synthetic_count=%s`)\n' "$SEED" "$COUNT" "$SEED" "$COUNT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate synthetic test files
        run: |
          echo "Generating synthetic test files (seed=${{ steps.synth.outputs.seed }}, count=${{ steps.synth.outputs.count }})..."
          # Use rledger doctor to generate synthetic files with manifest
          ./target/release/rledger doctor generate-synthetic \
            --output tests/compatibility/synthetic \
            --count ${{ steps.synth.outputs.count }} \
            --seed ${{ steps.synth.outputs.seed }} \
            --manifest \
            --skip-validation
          echo "Generated $(find tests/compatibility/synthetic -name '*.beancount' 2>/dev/null | wc -l) synthetic files"

          # Also generate bean-example files if available
          if command -v bean-example &> /dev/null; then
            echo "Generating bean-example files..."
            mkdir -p tests/compatibility/synthetic/bean-example
            for seed in 1 42 123; do
              end_date=$(date +%Y-%m-%d)
              start_date=$(date -d "$end_date - 1 year" +%Y-%m-%d 2>/dev/null || date -v-1y +%Y-%m-%d)
              output="tests/compatibility/synthetic/bean-example/example_seed${seed}.beancount"
              # Fail loudly on bean-example errors. Previously we swallowed
              # them, which silently shrank the synthetic test corpus and
              # gave false confidence in compat metrics.
              bean-example --seed "$seed" --date-begin "$start_date" --date-end "$end_date" --output "$output"
            done
            echo "Generated $(find tests/compatibility/synthetic/bean-example -name '*.beancount' 2>/dev/null | wc -l) bean-example files"
          fi
      - name: Verify tool installations
        run: |
          echo "=== Installed versions ==="
          bean-check --version
          bean-query --version
          ./target/release/rledger check --version
          ./target/release/rledger query --version
      - name: Format idempotence over the corpus
        # `rledger format` must be a fixed point on every real-world file
        # it can format: re-formatting its own output must be byte-
        # identical. Catches formatter bugs the small golden cases miss
        # (e.g. #1321 / the document variant). Files that don't format
        # cleanly are skipped. See scripts/format-idempotence.sh (#1323).
        run: |
          RLEDGER=./target/release/rledger ./scripts/format-idempotence.sh tests/compatibility/files
      - name: bean-format roundtrip over the corpus
        # External-oracle check: running Python beancount's own bean-format
        # over rledger's output must change nothing of substance. Pins
        # agreement with beancount on directive/posting order, tag/link
        # placement, decimal/currency normalization, costs and metadata -
        # everything except the deliberate column-alignment difference
        # (rledger aligns per-transaction, bean-format whole-file), which
        # the script normalizes away. See
        # scripts/format-bean-format-roundtrip.sh (#1324).
        run: |
          RLEDGER=./target/release/rledger ./scripts/format-bean-format-roundtrip.sh tests/compatibility/files
      - name: Comment preservation over the corpus
        # `rledger format` must never DELETE the author's comments. The
        # idempotence and bean-format-roundtrip gates both miss this class
        # (they compare the formatter against its OWN already-stripped output,
        # never the original input), which is why the #1332 / #1335 / #1337
        # comment-deletion bugs went unnoticed. This input-anchored check
        # fails if formatting drops any comment-only line.
        # See scripts/format-preserves-comments.sh (#1337).
        run: |
          RLEDGER=./target/release/rledger ./scripts/format-preserves-comments.sh tests/compatibility/files
      - name: Fetch previous results for regression detection
        run: |
          mkdir -p .github/badges
          curl -sSf https://raw.githubusercontent.com/${{ github.repository }}/compatibility/.github/badges/compat-check-results.jsonl \
            -o .github/badges/previous-check-results.jsonl 2>/dev/null || echo "" > .github/badges/previous-check-results.jsonl
          # BQL baseline (main's per-query results) for the regression gate below.
          curl -sSf https://raw.githubusercontent.com/${{ github.repository }}/compatibility/.github/badges/compat-bql-results.jsonl \
            -o .github/badges/previous-bql-results.jsonl 2>/dev/null || echo "" > .github/badges/previous-bql-results.jsonl
      - name: Run comprehensive compatibility test
        id: compat_test
        run: |
          echo "=== Comprehensive Compatibility Test (Parallel) ==="

          python3 << 'EOF'
          import json
          import subprocess
          import os
          import sys
          import re
          from collections import Counter, defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from dataclasses import dataclass, field, asdict
          from typing import Optional
          import multiprocessing

          try:
              from beancount import loader
              from beancount.core import data
              BEANCOUNT_AVAILABLE = True
          except ImportError:
              BEANCOUNT_AVAILABLE = False
              print("Warning: beancount not installed")

          TEST_DIRS = [Path("tests/compatibility/files"), Path("tests/compatibility/synthetic"), Path("tests/regressions")]
          EXCLUSIONS_FILE = Path("tests/compatibility/exclusions.toml")
          RLEDGER = "./target/release/rledger"
          RLEDGER_CHECK = [RLEDGER, "check"]
          RLEDGER_QUERY = [RLEDGER, "query"]

          # Use available CPUs, but cap at 8 for CI stability
          MAX_WORKERS = min(multiprocessing.cpu_count(), 8)
          print(f"Running with {MAX_WORKERS} parallel workers")

          # Load exclusions from TOML file
          excluded_patterns = []
          excluded_reasons = {}
          if EXCLUSIONS_FILE.exists():
              content = EXCLUSIONS_FILE.read_text()
              current_pattern = None
              for line in content.split('\n'):
                  line = line.strip()
                  if line.startswith('pattern = "'):
                      current_pattern = line.split('"')[1]
                      excluded_patterns.append(current_pattern)
                  elif line.startswith('reason = "') and current_pattern:
                      excluded_reasons[current_pattern] = line.split('"')[1]
              print(f"Loaded {len(excluded_patterns)} exclusion patterns")

          def is_excluded(file_path: Path) -> bool:
              """Check if a file matches any exclusion pattern."""
              rel_path = str(file_path)
              for pattern in excluded_patterns:
                  if pattern in rel_path:
                      return True
              return False

          # Category mapping based on directory structure
          def get_category(file_path: Path) -> str:
              parts = file_path.parts
              for part in parts:
                  # Regression tests from user-reported issues
                  if part == "regressions":
                      return "regressions"
                  # Synthetic test files (edge cases, proptest, bean-example)
                  if part == "synthetic":
                      # Further categorize by filename prefix
                      filename = file_path.name
                      if filename.startswith("edge_case_"):
                          return "synthetic-edge-cases"
                      elif filename.startswith("synthetic_"):
                          return "synthetic-proptest"
                      elif filename.startswith("example_"):
                          return "synthetic-bean-example"
                      return "synthetic-other"
                  # Real-world test categories
                  if part in ("parser", "validation", "plugins", "real-world", "edge-cases"):
                      return part
              return "other"

          @dataclass
          class FileResult:
              file: str
              category: str
              # Check comparison
              python_ok: bool = False
              rust_ok: bool = False
              check_match: bool = False
              # Error comparison
              python_error_count: int = 0
              rust_error_count: int = 0
              python_error_types: list = field(default_factory=list)
              rust_error_types: list = field(default_factory=list)
              error_presence_match: bool = False
              # Exact error-COUNT agreement, compared only when BOTH tools
              # flag errors (default True = not applicable). Verdict/presence
              # comparison is blind to a duplicated diagnostic on one side or
              # a missing dedicated diagnostic on the other (both fail ->
              # verdicts agree) — the two #1668 classes.
              error_count_match: bool = True
              # Directive counts
              python_directives: dict = field(default_factory=dict)
              rust_directives: dict = field(default_factory=dict)
              directive_counts_match: bool = False
              # Account/posting comparison
              accounts_match: bool = False
              posting_count_match: bool = False
              python_posting_count: int = 0
              rust_posting_count: int = 0
              # JSON parse health (rledger --format json output)
              rust_json_parse_failed: bool = False

              @property
              def full_match(self) -> bool:
                  return (self.check_match and self.accounts_match and
                          self.posting_count_match and self.error_presence_match)

          def test_file(file_path: Path) -> FileResult:
              """Test a single file - designed to run in parallel."""
              category = get_category(file_path)
              result = FileResult(file=file_path.name, category=category)

              # === Python parsing ===
              python_accounts = set()
              python_directive_counts = Counter()

              if BEANCOUNT_AVAILABLE:
                  try:
                      entries, errors, options = loader.load_file(str(file_path))
                      result.python_ok = (len(errors) == 0)
                      result.python_error_count = len(errors)

                      # Extract error types
                      for err in errors[:5]:
                          err_str = str(err)
                          match = re.search(r':\s*(\w+Error|\w+Warning|[A-Z]\d+)', err_str)
                          if match:
                              result.python_error_types.append(match.group(1))

                      for entry in entries:
                          type_name = type(entry).__name__
                          python_directive_counts[type_name] += 1

                          if isinstance(entry, data.Transaction):
                              result.python_posting_count += len(entry.postings)

                      result.python_directives = dict(python_directive_counts)
                  except Exception as e:
                      result.python_error_count = 1
                      result.python_error_types = [type(e).__name__]

              # === Python accounts via BQL (fair comparison with Rust) ===
              try:
                  proc = subprocess.run(
                      ["bean-query", str(file_path), "SELECT DISTINCT account ORDER BY account"],
                      capture_output=True, text=True, timeout=30
                  )
                  if proc.returncode == 0:
                      for line in proc.stdout.strip().split('\n')[2:]:
                          line = line.strip()
                          if line and not line.startswith('-') and 'row(s)' not in line:
                              python_accounts.add(line)
              except Exception:
                  pass

              # === Rust parsing - check ===
              try:
                  proc = subprocess.run(
                      [*RLEDGER_CHECK, "--no-cache", "--format", "json", str(file_path)],
                      capture_output=True, text=True, timeout=30
                  )
                  result.rust_ok = (proc.returncode == 0)
                  if proc.stdout.strip():
                      try:
                          data_json = json.loads(proc.stdout)
                          result.rust_error_count = data_json.get("error_count", 0)
                          for diag in data_json.get("diagnostics", [])[:5]:
                              code = diag.get("code", "")
                              if code:
                                  result.rust_error_types.append(code)
                      except json.JSONDecodeError as e:
                          result.rust_json_parse_failed = True
                          # Log immediately so it's visible in workflow output
                          print(f"WARNING: rledger --format json produced invalid JSON for {file_path}: {e}", file=sys.stderr)
                          preview = proc.stdout[:200].replace('\n', '\\n')
                          print(f"  stdout preview: {preview}", file=sys.stderr)
                          # Attempt recovery: find the first '{' and parse from there
                          # (handles plain-text prefix before valid JSON, as in #774)
                          json_start = proc.stdout.find('{')
                          if json_start != -1:
                              try:
                                  data_json = json.loads(proc.stdout[json_start:])
                                  result.rust_error_count = data_json.get("error_count", 0)
                                  for diag in data_json.get("diagnostics", [])[:5]:
                                      code = diag.get("code", "")
                                      if code:
                                          result.rust_error_types.append(code)
                                  print(f"  recovered {result.rust_error_count} errors from JSON after prefix", file=sys.stderr)
                              except json.JSONDecodeError:
                                  result.rust_error_count = 1
                                  result.rust_error_types = ["JsonParseFailed"]
                          else:
                              result.rust_error_count = 1
                              result.rust_error_types = ["JsonParseFailed"]
              except subprocess.TimeoutExpired:
                  result.rust_error_count = 1
                  result.rust_error_types = ["Timeout"]

              # Check match (both pass or both fail)
              result.check_match = (result.python_ok == result.rust_ok)
              result.error_presence_match = ((result.python_error_count > 0) == (result.rust_error_count > 0))
              # Diagnostic-level agreement on files BOTH tools reject: exact
              # error counts. Catches duplicated errors (#1668 oversell) and
              # missing dedicated diagnostics (#1668 balance currency) that
              # check_match/error_presence_match cannot see.
              if result.python_error_count > 0 and result.rust_error_count > 0:
                  result.error_count_match = (result.python_error_count == result.rust_error_count)

              # === Rust accounts via BQL ===
              rust_accounts = set()
              try:
                  proc = subprocess.run(
                      [*RLEDGER_QUERY, str(file_path), "SELECT DISTINCT account ORDER BY account"],
                      capture_output=True, text=True, timeout=30
                  )
                  if proc.returncode == 0:
                      for line in proc.stdout.strip().split('\n')[2:]:
                          line = line.strip()
                          if line and not line.startswith('-') and 'row(s)' not in line:
                              rust_accounts.add(line)
              except Exception:
                  pass

              # Only compare accounts when both tools report no errors.
              # On error files, BQL results differ because Rust has better error recovery
              # and interpolation (handles "too many missing numbers" cases Python rejects).
              if result.python_ok and result.rust_ok:
                  result.accounts_match = (python_accounts == rust_accounts)
              else:
                  result.accounts_match = True

              # === Rust posting count via BQL ===
              try:
                  proc = subprocess.run(
                      [*RLEDGER_QUERY, str(file_path), "SELECT COUNT(*)"],
                      capture_output=True, text=True, timeout=30
                  )
                  if proc.returncode == 0:
                      for line in proc.stdout.strip().split('\n')[2:]:
                          line = line.strip()
                          if line and not line.startswith('-') and 'row(s)' not in line:
                              try:
                                  result.rust_posting_count = int(line)
                              except ValueError:
                                  pass
                              break
              except Exception:
                  pass

              # Only compare posting counts for files that both tools validated successfully
              # (BQL returns 0 rows on error files, making comparison meaningless)
              if result.python_ok and result.rust_ok:
                  result.posting_count_match = (result.python_posting_count == result.rust_posting_count)
              else:
                  # Skip comparison for error files - mark as matching to avoid false negatives
                  result.posting_count_match = True

              return result

          # === Run tests in parallel ===
          all_files = []
          for test_dir in TEST_DIRS:
              if test_dir.exists():
                  all_files.extend(sorted(test_dir.rglob("*.beancount")))

          # Filter out excluded files
          files = []
          excluded_files = []
          for f in all_files:
              if is_excluded(f):
                  excluded_files.append(f)
              else:
                  files.append(f)

          print(f"Found {len(all_files)} total files from {len(TEST_DIRS)} directories")
          if excluded_files:
              print(f"  - Testing: {len(files)}")
              print(f"  - Excluded (known limitations): {len(excluded_files)}")
          else:
              print(f"Testing {len(files)} files...")

          results = []
          completed = 0

          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futures = {executor.submit(test_file, f): f for f in files}
              for future in as_completed(futures):
                  try:
                      result = future.result()
                      results.append(result)
                      completed += 1
                      if completed % 20 == 0:
                          print(f"  Progress: {completed}/{len(files)} files")
                  except Exception as e:
                      print(f"Error testing {futures[future]}: {e}")

          print(f"Completed {len(results)} files")

          # === Calculate category stats (after parallel execution) ===
          category_stats = defaultdict(lambda: {"total": 0, "check_match": 0, "full_match": 0})
          for r in results:
              category_stats[r.category]["total"] += 1
              if r.check_match:
                  category_stats[r.category]["check_match"] += 1
              if r.full_match:
                  category_stats[r.category]["full_match"] += 1

          # === Calculate totals ===
          total = len(results)
          check_match = sum(1 for r in results if r.check_match)
          accounts_match = sum(1 for r in results if r.accounts_match)
          posting_match = sum(1 for r in results if r.posting_count_match)
          error_match = sum(1 for r in results if r.error_presence_match)
          # Diagnostic-level metric over files BOTH tools reject.
          both_fail = [r for r in results if r.python_error_count > 0 and r.rust_error_count > 0]
          error_count_files = len(both_fail)
          error_count_matches = sum(1 for r in both_fail if r.error_count_match)
          error_count_pct = error_count_matches * 100 // error_count_files if error_count_files > 0 else 100
          full_match = sum(1 for r in results if r.full_match)

          # Percentages
          check_pct = check_match * 100 // total if total > 0 else 0
          accounts_pct = accounts_match * 100 // total if total > 0 else 0
          posting_pct = posting_match * 100 // total if total > 0 else 0
          error_pct = error_match * 100 // total if total > 0 else 0
          full_pct = full_match * 100 // total if total > 0 else 0

          # Rust only pass / Python only pass
          rust_only_pass = sum(1 for r in results if r.rust_ok and not r.python_ok)
          python_only_pass = sum(1 for r in results if r.python_ok and not r.rust_ok)

          # JSON parse failures (rledger --format json produced invalid output)
          json_parse_failures = [r for r in results if r.rust_json_parse_failed]

          # === Regression detection ===
          previous_file = Path(".github/badges/previous-check-results.jsonl")
          regressions = []
          if previous_file.exists() and previous_file.stat().st_size > 0:
              previous_results = {}
              for line in previous_file.read_text().strip().split('\n'):
                  if line:
                      try:
                          prev = json.loads(line)
                          previous_results[prev.get("file", "")] = prev
                      except json.JSONDecodeError:
                          pass

              for r in results:
                  prev = previous_results.get(r.file)
                  if prev:
                      # Regression: previously passed, now fails
                      prev_match = prev.get("python_ok") == prev.get("rust_ok")
                      if prev_match and not r.check_match:
                          regressions.append(r.file)

          # === Calculate synthetic vs real-world stats ===
          synthetic_results = [r for r in results if r.category.startswith("synthetic")]
          realworld_results = [r for r in results if not r.category.startswith("synthetic")]

          synthetic_total = len(synthetic_results)
          synthetic_check = sum(1 for r in synthetic_results if r.check_match)
          synthetic_pct = synthetic_check * 100 // synthetic_total if synthetic_total > 0 else 0

          realworld_total = len(realworld_results)
          realworld_check = sum(1 for r in realworld_results if r.check_match)
          realworld_pct = realworld_check * 100 // realworld_total if realworld_total > 0 else 0

          # === Print results ===
          total_excluded = len(excluded_files)
          print(f"Total files: {total}")
          if total_excluded > 0:
              print(f"Excluded files: {total_excluded} (known limitations)")
          print(f"Check exit match: {check_match}/{total} ({check_pct}%)")
          print(f"Accounts match: {accounts_match}/{total} ({accounts_pct}%)")
          print(f"Posting count match: {posting_match}/{total} ({posting_pct}%)")
          print(f"Error presence match: {error_match}/{total} ({error_pct}%)")
          print(f"Full match: {full_match}/{total} ({full_pct}%)")
          print(f"Rust only pass: {rust_only_pass}")
          print(f"Python only pass: {python_only_pass}")

          # List specific files for rust-only and python-only passes
          if rust_only_pass > 0:
              print(f"\n=== Rust-only pass files ({rust_only_pass}) ===")
              for r in results:
                  if r.rust_ok and not r.python_ok:
                      print(f"  - {r.file}")
                      print(f"    Python error count: {r.python_error_count}, types: {r.python_error_types[:5]}")

          if python_only_pass > 0:
              print(f"\n=== Python-only pass files ({python_only_pass}) ===")
              for r in results:
                  if r.python_ok and not r.rust_ok:
                      print(f"  - {r.file}")
                      print(f"    Rust error count: {r.rust_error_count}, types: {r.rust_error_types[:5]}")

          # Diagnostic-count mismatches on files both tools reject — the
          # duplicate/missing-diagnostic class. Report-only for now (tracked
          # via error_count_pct); promote to a gate once the metric is clean.
          count_mismatches = [r for r in both_fail if not r.error_count_match]
          if count_mismatches:
              print(f"\n=== Error-count mismatches on both-fail files ({len(count_mismatches)}/{error_count_files}) ===")
              for r in count_mismatches[:10]:
                  print(f"  - {r.file}: python {r.python_error_count} vs rust {r.rust_error_count}")
              if len(count_mismatches) > 10:
                  print(f"  ... and {len(count_mismatches) - 10} more")

          print(f"Regressions: {len(regressions)}")
          print(f"JSON parse failures: {len(json_parse_failures)}")

          if json_parse_failures:
              print(f"\n=== JSON PARSE FAILURES ({len(json_parse_failures)}) ===")
              print(f"rledger --format json produced invalid JSON for these files.")
              print(f"This indicates a bug in rledger's JSON output (see #774).")
              for r in json_parse_failures[:10]:
                  print(f"  - {r.file}")
              if len(json_parse_failures) > 10:
                  print(f"  ... and {len(json_parse_failures) - 10} more")

          print(f"\n=== Synthetic vs Real-World ===")
          print(f"  Real-world: {realworld_check}/{realworld_total} ({realworld_pct}%)")
          print(f"  Synthetic:  {synthetic_check}/{synthetic_total} ({synthetic_pct}%)")

          print("\n=== Per-Category Results ===")
          for cat, stats in sorted(category_stats.items()):
              cat_total = stats["total"]
              cat_check = stats["check_match"]
              cat_full = stats["full_match"]
              cat_check_pct = cat_check * 100 // cat_total if cat_total > 0 else 0
              cat_full_pct = cat_full * 100 // cat_total if cat_total > 0 else 0
              print(f"  {cat}: {cat_check}/{cat_total} check ({cat_check_pct}%), {cat_full}/{cat_total} full ({cat_full_pct}%)")

          if regressions:
              print(f"\n=== REGRESSIONS DETECTED ===")
              for f in regressions[:10]:
                  print(f"  - {f}")
              if len(regressions) > 10:
                  print(f"  ... and {len(regressions) - 10} more")

          # === Write to GITHUB_OUTPUT ===
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"check_total={total}\n")
              f.write(f"check_excluded={total_excluded}\n")
              f.write(f"check_match={check_match}\n")
              f.write(f"check_match_pct={check_pct}\n")
              f.write(f"accounts_match={accounts_match}\n")
              f.write(f"accounts_pct={accounts_pct}\n")
              f.write(f"posting_match={posting_match}\n")
              f.write(f"posting_pct={posting_pct}\n")
              f.write(f"error_match={error_match}\n")
              f.write(f"error_count_files={error_count_files}\n")
              f.write(f"error_count_matches={error_count_matches}\n")
              f.write(f"error_count_pct={error_count_pct}\n")
              f.write(f"error_pct={error_pct}\n")
              f.write(f"full_match={full_match}\n")
              f.write(f"full_pct={full_pct}\n")
              f.write(f"rust_only_pass={rust_only_pass}\n")
              f.write(f"python_only_pass={python_only_pass}\n")
              f.write(f"regression_count={len(regressions)}\n")
              f.write(f"json_parse_failures={len(json_parse_failures)}\n")
              # Synthetic vs real-world breakdown
              f.write(f"realworld_total={realworld_total}\n")
              f.write(f"realworld_match={realworld_check}\n")
              f.write(f"realworld_pct={realworld_pct}\n")
              f.write(f"synthetic_total={synthetic_total}\n")
              f.write(f"synthetic_match={synthetic_check}\n")
              f.write(f"synthetic_pct={synthetic_pct}\n")
              # Category percentages
              for cat, stats in category_stats.items():
                  cat_pct = stats["check_match"] * 100 // stats["total"] if stats["total"] > 0 else 0
                  f.write(f"cat_{cat}_pct={cat_pct}\n")

          # === Write detailed results to JSONL ===
          with open("compat-check-results.jsonl", "w") as f:
              for r in results:
                  f.write(json.dumps(asdict(r)) + "\n")

          # === Write category summary ===
          with open("compat-category-results.json", "w") as f:
              json.dump(dict(category_stats), f, indent=2)

          # === Write regressions ===
          if regressions:
              with open("compat-regressions.txt", "w") as f:
                  for r in regressions:
                      f.write(r + "\n")
          EOF
      - name: Validate stale-divergence detection logic
        run: |
      # Compare booked VALUES, not just shapes. The comprehensive test above
      # compares `check_match`, `accounts_match`, `posting_count_match` and
      # `error_presence_match` — how MANY postings there are and WHETHER there
      # was an error. It never compares an amount, so a booking or
      # interpolation bug that yields the right number of postings with the
      # wrong numbers in them passes it silently. For an accounting tool that
      # is the failure that matters most.
      #
      # Advisory, not gating. One known divergence remains once #1913 lands:
      # issue-520.beancount, a tracked regression fixture. Flip
      # `continue-on-error` off once that set is at zero.
      # SEPARATE STEP, and deliberately NOT continue-on-error. The comparison
      # below is advisory; this is not. It asserts the error axis can report a
      # disagreement at all, using fixtures with known answers. A sweep that
      # only ever prints zeros is indistinguishable from one that is silently
      # broken, and this script shipped exactly that bug once (an ImportError
      # would have marked every file "undecidable" and passed).
      #
      # It lived INSIDE the advisory step in the first draft of this change,
      # where continue-on-error swallowed its exit status - the guard against
      # vacuous passing, itself passing vacuously.
      - name: Self-test the beancount oracle
        run: |
          python3 scripts/compat-values.py \
            --rledger ./target/release/rledger --self-test
      - name: Compare booked values against beancount
        continue-on-error: true
        run: |
          # `pipefail` because the pipe into `tee` would otherwise mask the
          # script's exit status: a crashed comparison would leave an empty
          # compat-values.txt and a green step, which is exactly the
          # vacuous-pass shape this comparison exists to catch.
          set -o pipefail
          python3 scripts/compat-values.py \
            --rledger ./target/release/rledger \
            --corpus tests/compatibility/files tests/regressions \
            | tee compat-values.txt
          {
            echo "## Booked-value comparison"
            echo ""
            echo '```'
            head -40 compat-values.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run BQL compatibility test
        id: bql_compat
        run: |
          echo "=== BQL Compatibility Test ==="
          # --baseline makes this step EXIT NON-ZERO (fail the job) if any
          # (file, query) pair that matched on main now fails — i.e. a BQL
          # regression. This is what blocks a JOURNAL-style drop from merging.
          # Nightly sweeps the WHOLE eligible corpus; PRs keep a budget.
          # Same split as the fuzz workflow, for the same reason: the BQL step
          # runs ~17 file×query pairs per second, so a full sweep costs about
          # eleven minutes — free on a schedule, not free on every PR. A
          # divergence that only a rarely-selected file exposes is then found
          # within a day instead of never.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MAX_FILES=100000   # effectively uncapped; the corpus is ~673
          else
            MAX_FILES=150
          fi
          echo "querying up to $MAX_FILES files (event: ${{ github.event_name }})"
          python3 scripts/compat-bql-test.py \
            --corpus tests/compatibility/bql-queries.toml \
            --files-from compat-check-results.jsonl \
            --rledger ./target/release/rledger \
            --output compat-bql-results.jsonl \
            --baseline .github/badges/previous-bql-results.jsonl \
            --max-files "$MAX_FILES" \
            --github-output
      # `report budget` is arithmetic over generated data, so it is checked by
      # generation rather than by examples: the budgeted figure against a
      # clean-room per-day accrual, each row's actual against an independent
      # recomputation, both TOTALs against a once-per-posting oracle, and all
      # three output formats for column separability and CSV/JSON agreement.
      #
      # Runs HERE, not with the gates below, because the
      # "Commit results to compatibility branch" step checks out an orphan
      # branch that has no `scripts/` and no `target/` — a gate placed after it
      # cannot even find this script. It records a verdict instead and the gate
      # at the end fails on that, which is the same shape as the other gates.
      #
      # Seeding matches the synthetic corpus policy: fresh nightly, fixed for
      # PR/push so a red X does not move when an unrelated commit lands.
      # Reproduce any failure with `--seed <n> --count 1`.
      - name: Budget report fuzz
        id: budget_fuzz
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BUDGET_SEED="${{ github.run_id }}"; BUDGET_COUNT=500
          else
            BUDGET_SEED=12345; BUDGET_COUNT=150
          fi
          printf 'seed=%s\ncount=%s\n' "$BUDGET_SEED" "$BUDGET_COUNT" >> "$GITHUB_OUTPUT"
          if python3 scripts/compat-budget-fuzz.py --self-test \
             && python3 scripts/compat-budget-fuzz.py \
                  --rledger ./target/release/rledger \
                  --seed "$BUDGET_SEED" --count "$BUDGET_COUNT"; then
            echo "failed=0" >> "$GITHUB_OUTPUT"
          else
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate YAML summary
        run: |
          cat > compat-results.yaml << EOF
          # Rustledger Compatibility Results
          # Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          summary:
            total_files: ${{ steps.compat_test.outputs.check_total }}
            excluded_files: ${{ steps.compat_test.outputs.check_excluded }}
            check_exit_match_pct: ${{ steps.compat_test.outputs.check_match_pct }}
            full_match_pct: ${{ steps.compat_test.outputs.full_pct }}
            bql_match_pct: ${{ steps.bql_compat.outputs.bql_pct }}
            bql_raw_match_pct: ${{ steps.bql_compat.outputs.bql_raw_pct }}
            regressions: ${{ steps.compat_test.outputs.regression_count }}

          check_compatibility:
            total_files: ${{ steps.compat_test.outputs.check_total }}
            excluded_files: ${{ steps.compat_test.outputs.check_excluded }}
            exit_code_match: ${{ steps.compat_test.outputs.check_match }}
            exit_code_match_pct: ${{ steps.compat_test.outputs.check_match_pct }}
            rust_only_pass: ${{ steps.compat_test.outputs.rust_only_pass }}
            python_only_pass: ${{ steps.compat_test.outputs.python_only_pass }}

          ast_compatibility:
            accounts_match: ${{ steps.compat_test.outputs.accounts_match }}
            accounts_match_pct: ${{ steps.compat_test.outputs.accounts_pct }}
            posting_count_match: ${{ steps.compat_test.outputs.posting_match }}
            posting_count_match_pct: ${{ steps.compat_test.outputs.posting_pct }}
            error_presence_match: ${{ steps.compat_test.outputs.error_match }}
            error_presence_match_pct: ${{ steps.compat_test.outputs.error_pct }}
            full_match: ${{ steps.compat_test.outputs.full_match }}
            full_match_pct: ${{ steps.compat_test.outputs.full_pct }}

          bql_compatibility:
            queries_tested: ${{ steps.bql_compat.outputs.bql_total }}
            queries_matching: ${{ steps.bql_compat.outputs.bql_match }}
            match_pct: ${{ steps.bql_compat.outputs.bql_pct }}
            # Raw = nothing masked. Reported next to match_pct so the size of
            # KNOWN_*_DIVERGENCES is visible rather than inferable; the gap
            # between the two moves whenever pins are added (#1902).
            raw_match_pct: ${{ steps.bql_compat.outputs.bql_raw_pct }}
            known_divergences: ${{ steps.bql_compat.outputs.bql_known_divergences }}

          regressions:
            count: ${{ steps.compat_test.outputs.regression_count }}
          EOF

          echo "=== YAML Summary ==="
          cat compat-results.yaml
      - name: Fetch existing history from compatibility branch
        run: |
          curl -sSf https://raw.githubusercontent.com/${{ github.repository }}/compatibility/.github/badges/compat-history.json \
            -o .github/badges/compat-history.json 2>/dev/null || echo "[]" > .github/badges/compat-history.json
      - name: Update results and generate charts
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime
          import matplotlib.pyplot as plt
          import matplotlib.dates as mdates
          from pathlib import Path

          # Get results from environment
          check_match_pct = int(os.environ.get('CHECK_MATCH_PCT', 0))
          accounts_pct = int(os.environ.get('ACCOUNTS_PCT', 0))
          posting_pct = int(os.environ.get('POSTING_PCT', 0))
          error_pct = int(os.environ.get('ERROR_PCT', 0))
          full_pct = int(os.environ.get('FULL_PCT', 0))
          bql_pct = int(os.environ.get('BQL_PCT', 0))
          bql_raw_pct = int(os.environ.get('BQL_RAW_PCT', 0))
          regression_count = int(os.environ.get('REGRESSION_COUNT', 0))

          now = datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          date_short = datetime.utcnow().strftime('%Y-%m-%d')

          # Update history
          history_file = Path('.github/badges/compat-history.json')
          history = json.loads(history_file.read_text())
          history.append({
              'date': date_short,
              'timestamp': now,
              'check_match_pct': check_match_pct,
              'accounts_pct': accounts_pct,
              'posting_pct': posting_pct,
              'error_pct': error_pct,
              'full_pct': full_pct,
              'bql_pct': bql_pct,
              'regression_count': regression_count,
          })
          history = history[-90:]  # Keep 90 days
          history_file.write_text(json.dumps(history, indent=2))

          # Common chart styling
          plt.style.use('dark_background')

          def style_chart(ax, fig):
              ax.grid(True, alpha=0.3, linestyle='--')
              ax.set_facecolor('#1a1a2e')
              fig.patch.set_facecolor('#1a1a2e')
              ax.xaxis.set_major_formatter(mdates.DateFormatter('%b %d'))
              ax.xaxis.set_major_locator(mdates.AutoDateLocator())
              plt.xticks(rotation=45, ha='right')
              ax.set_ylim(0, 105)  # Percentages with some headroom

          # Generate compatibility charts
          if len(history) >= 2:
              dates = [datetime.strptime(h['date'], '%Y-%m-%d') for h in history]
              check_vals = [h.get('check_match_pct', 0) for h in history]
              accounts_vals = [h.get('accounts_pct', 0) for h in history]
              posting_vals = [h.get('posting_pct', 0) for h in history]
              error_vals = [h.get('error_pct', 0) for h in history]
              full_vals = [h.get('full_pct', 0) for h in history]
              bql_vals = [h.get('bql_pct', 0) for h in history]

              # Chart 1: Main compatibility metrics over time
              fig, ax = plt.subplots(figsize=(10, 4), dpi=100)
              ax.plot(dates, check_vals, 'o-', color='#00d4aa', linewidth=2,
                      markersize=5, label='Check Exit Match')
              ax.plot(dates, full_vals, 's-', color='#e74c3c', linewidth=2,
                      markersize=5, label='Full AST Match')
              ax.plot(dates, bql_vals, '^-', color='#3498db', linewidth=2,
                      markersize=5, label='BQL Match')
              ax.axhline(y=90, color='#f4b942', linestyle='--', alpha=0.5, label='90% target')

              ax.set_ylabel('Match %', fontsize=12, color='white')
              ax.legend(loc='lower right', framealpha=0.9)
              ax.set_title('Beancount Compatibility Over Time', fontsize=13, color='white', pad=10)
              style_chart(ax, fig)

              plt.tight_layout()
              plt.savefig('.github/badges/compat-main-chart.svg', format='svg',
                          facecolor='#1a1a2e', edgecolor='none', bbox_inches='tight')
              plt.savefig('.github/badges/compat-main-chart.png', format='png',
                          facecolor='#1a1a2e', edgecolor='none', bbox_inches='tight')
              plt.close()
              print("Generated main compatibility chart")

              # Chart 2: AST comparison metrics over time
              fig, ax = plt.subplots(figsize=(10, 4), dpi=100)
              ax.plot(dates, accounts_vals, 'o-', color='#00d4aa', linewidth=2,
                      markersize=4, label='Accounts Match')
              ax.plot(dates, posting_vals, 's-', color='#f4b942', linewidth=2,
                      markersize=4, label='Posting Count Match')
              ax.plot(dates, error_vals, '^-', color='#9b59b6', linewidth=2,
                      markersize=4, label='Error Presence Match')
              ax.plot(dates, full_vals, 'D-', color='#e74c3c', linewidth=2,
                      markersize=4, label='Full Match')

              ax.set_ylabel('Match %', fontsize=12, color='white')
              ax.legend(loc='lower right', framealpha=0.9, fontsize=9)
              ax.set_title('AST/Directive Compatibility Metrics', fontsize=13, color='white', pad=10)
              style_chart(ax, fig)

              plt.tight_layout()
              plt.savefig('.github/badges/compat-ast-chart.svg', format='svg',
                          facecolor='#1a1a2e', edgecolor='none', bbox_inches='tight')
              plt.savefig('.github/badges/compat-ast-chart.png', format='png',
                          facecolor='#1a1a2e', edgecolor='none', bbox_inches='tight')
              plt.close()
              print("Generated AST compatibility chart")

              # Chart 3: Combined overview (bar chart of latest values)
              fig, ax = plt.subplots(figsize=(10, 4), dpi=100)
              metrics = ['Check\nExit', 'Accounts', 'Posting\nCount', 'Error\nPresence', 'Full\nMatch', 'BQL']
              values = [check_match_pct, accounts_pct, posting_pct, error_pct, full_pct, bql_pct]
              colors = ['#00d4aa', '#3498db', '#f4b942', '#9b59b6', '#e74c3c', '#1abc9c']

              bars = ax.bar(metrics, values, color=colors, edgecolor='white', linewidth=1)
              ax.axhline(y=90, color='#f4b942', linestyle='--', alpha=0.7, label='90% target')

              # Add value labels on bars
              for bar, val in zip(bars, values):
                  height = bar.get_height()
                  ax.annotate(f'{val}%',
                              xy=(bar.get_x() + bar.get_width() / 2, height),
                              xytext=(0, 3),
                              textcoords="offset points",
                              ha='center', va='bottom', fontsize=11, color='white')

              ax.set_ylabel('Match %', fontsize=12, color='white')
              ax.set_title('Beancount Compatibility Summary', fontsize=13, color='white', pad=10)
              ax.set_facecolor('#1a1a2e')
              fig.patch.set_facecolor('#1a1a2e')
              ax.set_ylim(0, 110)
              ax.grid(True, alpha=0.3, linestyle='--', axis='y')

              plt.tight_layout()
              plt.savefig('.github/badges/compat-summary-chart.svg', format='svg',
                          facecolor='#1a1a2e', edgecolor='none', bbox_inches='tight')
              plt.savefig('.github/badges/compat-summary-chart.png', format='png',
                          facecolor='#1a1a2e', edgecolor='none', bbox_inches='tight')
              plt.close()
              print("Generated summary chart")

              # Chart 4: Category breakdown (read from category results)
              try:
                  with open("compat-category-results.json") as f:
                      cat_data = json.load(f)

                  categories = sorted(cat_data.keys())
                  cat_values = []
                  for cat in categories:
                      stats = cat_data[cat]
                      pct = stats["check_match"] * 100 // stats["total"] if stats["total"] > 0 else 0
                      cat_values.append(pct)

                  fig, ax = plt.subplots(figsize=(10, 4), dpi=100)
                  cat_colors = ['#00d4aa', '#3498db', '#f4b942', '#9b59b6', '#e74c3c', '#1abc9c']
                  bars = ax.barh(categories, cat_values, color=cat_colors[:len(categories)], edgecolor='white', linewidth=1)
                  ax.axvline(x=90, color='#f4b942', linestyle='--', alpha=0.7, label='90% target')

                  # Add value labels
                  for bar, val in zip(bars, cat_values):
                      width = bar.get_width()
                      ax.annotate(f'{val}%',
                                  xy=(width, bar.get_y() + bar.get_height() / 2),
                                  xytext=(5, 0),
                                  textcoords="offset points",
                                  ha='left', va='center', fontsize=10, color='white')

                  ax.set_xlabel('Check Match %', fontsize=12, color='white')
                  ax.set_title('Compatibility by Category', fontsize=13, color='white', pad=10)
                  ax.set_facecolor('#1a1a2e')
                  fig.patch.set_facecolor('#1a1a2e')
                  ax.set_xlim(0, 110)
                  ax.grid(True, alpha=0.3, linestyle='--', axis='x')

                  plt.tight_layout()
                  plt.savefig('.github/badges/compat-category-chart.svg', format='svg',
                              facecolor='#1a1a2e', edgecolor='none', bbox_inches='tight')
                  plt.savefig('.github/badges/compat-category-chart.png', format='png',
                              facecolor='#1a1a2e', edgecolor='none', bbox_inches='tight')
                  plt.close()
                  print("Generated category chart")
              except Exception as e:
                  print(f"Could not generate category chart: {e}")

          # Generate shields.io badge JSON
          badge_color = "brightgreen" if check_match_pct >= 90 else "yellow" if check_match_pct >= 70 else "red"
          badge_data = {
              "schemaVersion": 1,
              "label": "beancount compat",
              "message": f"{check_match_pct}%",
              "color": badge_color,
          }
          Path('.github/badges/compat-badge.json').write_text(json.dumps(badge_data))
          print(f"Generated badge JSON: {check_match_pct}% ({badge_color})")

          print(f"\n## Compatibility Results")
          print(f"Check exit match: {check_match_pct}%")
          print(f"Accounts match: {accounts_pct}%")
          print(f"Posting count match: {posting_pct}%")
          print(f"Error presence match: {error_pct}%")
          print(f"Full AST match: {full_pct}%")
          print(f"BQL match: {bql_pct}% (raw {bql_raw_pct}%, {bql_pct - bql_raw_pct} pts masked)")
          if regression_count > 0:
              print(f"⚠️ Regressions detected: {regression_count}")
          EOF
        env:
          CHECK_MATCH_PCT: ${{ steps.compat_test.outputs.check_match_pct }}
          ACCOUNTS_PCT: ${{ steps.compat_test.outputs.accounts_pct }}
          POSTING_PCT: ${{ steps.compat_test.outputs.posting_pct }}
          ERROR_PCT: ${{ steps.compat_test.outputs.error_pct }}
          FULL_PCT: ${{ steps.compat_test.outputs.full_pct }}
          BQL_PCT: ${{ steps.bql_compat.outputs.bql_pct }}
          BQL_RAW_PCT: ${{ steps.bql_compat.outputs.bql_raw_pct }}
          REGRESSION_COUNT: ${{ steps.compat_test.outputs.regression_count }}
      - name: Update summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Beancount Compatibility Results

          ### Summary
          | Metric | Value |
          |--------|-------|
          | **Check exit match** | **${{ steps.compat_test.outputs.check_match_pct }}%** |
          | **Full AST match** | **${{ steps.compat_test.outputs.full_pct }}%** |
          | **BQL match** | **${{ steps.bql_compat.outputs.bql_pct }}%** |
          | BQL match (raw, nothing masked) | ${{ steps.bql_compat.outputs.bql_raw_pct }}% |
          | BQL known divergences masked | ${{ steps.bql_compat.outputs.bql_known_divergences }} |
          | Regressions | ${{ steps.compat_test.outputs.regression_count }} |
          | JSON parse failures | ${{ steps.compat_test.outputs.json_parse_failures }} |

          ### Check Compatibility (bean-check vs rledger-check)
          | Metric | Value |
          |--------|-------|
          | Total files | ${{ steps.compat_test.outputs.check_total }} |
          | Exit code match | ${{ steps.compat_test.outputs.check_match_pct }}% (${{ steps.compat_test.outputs.check_match }}/${{ steps.compat_test.outputs.check_total }}) |
          | Rust only pass | ${{ steps.compat_test.outputs.rust_only_pass }} |
          | Python only pass | ${{ steps.compat_test.outputs.python_only_pass }} |

          ### AST/Directive Compatibility
          | Metric | Match Rate |
          |--------|------------|
          | Accounts match | ${{ steps.compat_test.outputs.accounts_pct }}% (${{ steps.compat_test.outputs.accounts_match }}/${{ steps.compat_test.outputs.check_total }}) |
          | Posting count match | ${{ steps.compat_test.outputs.posting_pct }}% (${{ steps.compat_test.outputs.posting_match }}/${{ steps.compat_test.outputs.check_total }}) |
          | Error presence match | ${{ steps.compat_test.outputs.error_pct }}% (${{ steps.compat_test.outputs.error_match }}/${{ steps.compat_test.outputs.check_total }}) |
          | Full match | ${{ steps.compat_test.outputs.full_pct }}% (${{ steps.compat_test.outputs.full_match }}/${{ steps.compat_test.outputs.check_total }}) |

          ### BQL Compatibility
          | Metric | Value |
          |--------|-------|
          | Queries tested | ${{ steps.bql_compat.outputs.bql_total }} |
          | Queries matching | ${{ steps.bql_compat.outputs.bql_match }} |
          | Known Python divergences | ${{ steps.bql_compat.outputs.bql_known_divergences }} |
          | Effective match | ${{ steps.bql_compat.outputs.bql_pct }}% |

          ### Source Breakdown
          | Source | Check Match |
          |--------|-------------|
          | **Real-world files** | ${{ steps.compat_test.outputs.realworld_pct }}% (${{ steps.compat_test.outputs.realworld_match }}/${{ steps.compat_test.outputs.realworld_total }}) |
          | **Synthetic files** | ${{ steps.compat_test.outputs.synthetic_pct }}% (${{ steps.compat_test.outputs.synthetic_match }}/${{ steps.compat_test.outputs.synthetic_total }}) |

          *Real-world: Downloaded from 10+ beancount repositories. Synthetic: Generated edge cases and proptest fixtures.*
          EOF
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        # GITHUB_TOKEN is read-only on `pull_request` workflows from forks
        # (a GitHub security guarantee; `permissions: pull-requests: write`
        # above does not override it). Make comment-posting best-effort so
        # the job's success/failure reflects the compatibility-test result,
        # not whether we could leave a comment. Fork PRs silently skip with
        # a log line; non-fork PRs continue to receive the comment. (#1093)
        #
        # The previous step name was `Post PR comment (release PRs only)`
        # but the `if:` above runs on every `pull_request`, not just release
        # PRs — renamed to match actual behavior. (#1093)
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            // Read results
            let resultsYaml = '';
            try {
              resultsYaml = fs.readFileSync('compat-results.yaml', 'utf8');
            } catch (e) {
              resultsYaml = 'Results file not found';
            }

            // Parse key metrics from the summary section
            const checkMatch = resultsYaml.match(/check_exit_match_pct:\s*([\d.]+)/);
            const bqlMatch = resultsYaml.match(/bql_match_pct:\s*([\d.]+)/);
            // RAW = nothing masked, and the count of what was. This comment is the
            // most-read surface in the repo, so it is where quoting the effective
            // figure alone does the most damage: #1927 pinned 51 proven-upstream
            // pairs in one PR and moved effective from 93% to 95% with raw
            // unchanged underneath. Anyone reading only the headline saw
            // compatibility improve when nothing about rledger had (#1902).
            //
            // The keys do not collide: `bql_raw_match_pct` does not contain the
            // substring `bql_match_pct`.
            const bqlRawMatch = resultsYaml.match(/bql_raw_match_pct:\s*([\d.]+)/);
            const bqlKnown = resultsYaml.match(/known_divergences:\s*(\d+)/);
            const totalFiles = resultsYaml.match(/total_files:\s*(\d+)/);
            const fullMatch = resultsYaml.match(/full_match_pct:\s*([\d.]+)/);

            const checkRate = checkMatch ? checkMatch[1] : 'N/A';
            const bqlRate = bqlMatch ? bqlMatch[1] : 'N/A';
            // Degrade to the old single-figure cell rather than printing 'N/A'
            // noise: a re-run against an artifact from before #1929 has no raw key.
            const bqlRawRate = bqlRawMatch ? bqlRawMatch[1] : null;
            const bqlMasked = bqlKnown ? bqlKnown[1] : null;
            const bqlCell = bqlRawRate === null
              ? `${bqlRate}%`
              : `${bqlRate}% (raw ${bqlRawRate}%`
                + (bqlMasked === null ? '' : `, ${bqlMasked} masked`) + ')';
            const total = totalFiles ? totalFiles[1] : '?';
            const fullRate = fullMatch ? fullMatch[1] : 'N/A';

            const status = parseFloat(checkRate) >= 99 && parseFloat(bqlRate) >= 99 ? '✅' : '⚠️';

            const body = `## ${status} Compatibility Test Results

            | Metric | Result |
            |--------|--------|
            | **Check Compatibility** | ${checkRate}% |
            | **BQL Compatibility** | ${bqlCell} |
            | **Full AST Match** | ${fullRate}% |
            | **Total Files** | ${total} |

            <details>
            <summary>What's tested</summary>

            - **Check**: Exit codes and error counts match \`bean-check\`
            - **BQL**: Query results match \`bean-query\`
              The headline is the EFFECTIVE rate, after pairs where beanquery
              itself is wrong are masked. **raw** is the same run with nothing
              masked. A widening gap means the registry grew, not that rledger
              changed.
            - **Files**: ~800 test files downloaded from 10+ beancount repositories

            </details>

            <sub>Full results available in workflow artifacts</sub>`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Compatibility Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
      - name: Commit results to compatibility branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save the generated files. Some are produced conditionally by
          # earlier steps, so guard each cp with `[ -f ]` rather than
          # swallowing cp errors — silent failures here have left badges
          # stale before.
          cp -r .github/badges /tmp/badges
          cp compat-results.yaml /tmp/
          for f in compat-check-results.jsonl compat-bql-results.jsonl \
                   compat-category-results.json compat-regressions.txt; do
            if [ -f "$f" ]; then cp "$f" /tmp/; fi
          done

          # Discard local changes and untracked files before switching branches
          git checkout -- .
          git clean -fd

          # Fetch and checkout compatibility branch (create if doesn't exist)
          git fetch origin compatibility || true
          if git rev-parse --verify origin/compatibility >/dev/null 2>&1; then
            git checkout compatibility
            git pull --rebase origin compatibility || true
          else
            git checkout --orphan compatibility
            git rm -rf . || true
            mkdir -p .github/badges
          fi

          # Copy results and commit. Same `[ -f ]` guard pattern as above —
          # we don't fail if the optional files weren't produced, but we DO
          # surface a real cp error.
          cp -r /tmp/badges/* .github/badges/
          cp /tmp/compat-results.yaml .github/badges/
          for f in compat-check-results.jsonl compat-bql-results.jsonl \
                   compat-category-results.json compat-regressions.txt; do
            if [ -f "/tmp/$f" ]; then cp "/tmp/$f" .github/badges/; fi
          done

          git add .github/badges/
          git diff --staged --quiet || git commit -m "chore: update compatibility results"
          git push origin compatibility

      # EVERY gate below is `!cancelled()`, not the implicit `success()`.
      #
      # A bare `if:` means "only if nothing has failed yet", so the first gate
      # to fire SKIPS the rest — and these gates are independent alarms about
      # different things. That matters most for the check-regression gate: the
      # compatibility branch is committed BEFORE the gates run, so its baseline
      # has already advanced. A regression whose alarm was skipped is silent on
      # the re-run too, because the regressed files are the baseline by then.
      # One failure hiding another here means hiding it permanently.
      - name: Gate on budget report fuzz
        if: ${{ !cancelled() && steps.budget_fuzz.outputs.failed == '1' }}
        run: |
          echo "::error::Budget report fuzz found a divergence (seed=${{ steps.budget_fuzz.outputs.seed }}, count=${{ steps.budget_fuzz.outputs.count }}). Reproduce with: python3 scripts/compat-budget-fuzz.py --rledger ./target/release/rledger --seed <n> --count 1"
          exit 1

      # Mirrors the BQL step's `--baseline` (which exits non-zero on a BQL
      # regression). Previously check regressions were only printed and written
      # to compat-regressions.txt — a file that matched on the previous run and
      # mismatches now scrolled by silently. A one-shot red alert: the committed
      # baseline advances, and the details live in compat-regressions.txt on the
      # compatibility branch.
      - name: Gate on check regressions
        if: ${{ !cancelled() && steps.compat_test.outcome == 'success' && steps.compat_test.outputs.regression_count != '0' }}
        run: |
          echo "::error::${{ steps.compat_test.outputs.regression_count }} check regression(s) vs the previous run — files that matched before and mismatch now. See the 'Run comprehensive compatibility test' log and compat-regressions.txt."
          exit 1

      # DIFFERENTIAL GATE: synthetic files are generated fresh (random seed on
      # nightly runs), so a divergence there has NO baseline entry and the
      # regression gate above is structurally blind to it. Gate ABSOLUTELY:
      # every synthetic file's check verdict must match Python's, or the run
      # fails with the divergent list and the seed to reproduce.
      - name: Gate on synthetic differential divergences
        if: ${{ !cancelled() && steps.compat_test.outcome == 'success' && steps.compat_test.outputs.synthetic_match != steps.compat_test.outputs.synthetic_total }}
        run: |
          echo "::error::Synthetic differential divergence: ${{ steps.compat_test.outputs.synthetic_match }}/${{ steps.compat_test.outputs.synthetic_total }} synthetic files agree with Python (seed=${{ steps.synth.outputs.seed }}). Divergent files:"
          python3 - <<'PYEOF'
          import json, os, sys
          # The jsonl lives in CWD on PR runs; the compatibility-branch step
          # (push/schedule only) moves it to /tmp before switching branches.
          path = next((p for p in ('compat-check-results.jsonl', '/tmp/compat-check-results.jsonl') if os.path.exists(p)), None)
          if path is None:
              print('::error::compat-check-results.jsonl not found in CWD or /tmp — cannot list divergent files (the gate condition itself is authoritative)')
              sys.exit(0)  # the step already exits 1 after this snippet
          for line in open(path):
              r = json.loads(line)
              if r.get('category', '').startswith('synthetic') and not r.get('check_match', True):
                  print(f"  {r['file']}: python_ok={r['python_ok']} rust_ok={r['rust_ok']}")
          PYEOF
          echo "Reproduce: gh workflow run compat.yml -f synthetic_seed=${{ steps.synth.outputs.seed }} -f synthetic_count=${{ steps.synth.outputs.count }}"
          exit 1

      - name: Upload divergent synthetic corpus
        # Only when the synthetic gate itself tripped — a plain `failure()`
        # would ship the corpus for any unrelated late-step failure
        # (review catch).
        if: failure() && steps.compat_test.outputs.synthetic_match != steps.compat_test.outputs.synthetic_total
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthetic-corpus-seed-${{ steps.synth.outputs.seed }}
          path: tests/compatibility/synthetic/
          retention-days: 30

  # Python-gated cargo integration tests.
  #
  # Several cargo test suites compare rledger against Python beancount
  # tooling directly (Command::new("bean-check") / "bean-price") and SKIP
  # SILENTLY when the binary is absent — which is every environment except
  # this one. The use-before-open silent-pass bug (#1742) sat on main
  # behind exactly that skip: test_account_lifecycle_consistency would
  # have caught it, but nothing in CI ever ran the test with bean-check
  # on PATH.
  #
  # This job exists so those tests actually gate PRs:
  # 1. install beancount + beanprice and FAIL LOUDLY if the binaries
  #    aren't runnable (a silent skip here would recreate the hole this
  #    job closes);
  # 2. run the python-gated suites — keep the list in sync with
  #    `grep -rl 'Command::new("bean-' crates/*/tests` (currently:
  #    rustledger integration_test + bean_price_compat,
  #    rustledger-core synthetic_generation);
  # 3. grep the captured output for every suite's skip marker, so a new
  #    availability probe (different binary, a container check) can't
  #    quietly reintroduce the green-skip.
  python-gated-cargo-tests:
    name: Python-gated cargo tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      # rust-cache intentionally omitted — see the note on the
      # compatibility-test job (LGPL-3.0 license-check interaction).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install beancount and beanprice
        run: pip install beancount beanprice
      - name: Assert python tools are runnable (no silent skips)
        run: |
          # The tests skip when these binaries are missing. This step
          # guarantees that skip path is dead in CI — if a binary breaks,
          # the job goes red HERE instead of the tests green-skipping.
          bean-check --version
          # bean-price has no --version flag (it errors demanding sources);
          # --help is the probe bean_price_compat.rs itself uses.
          bean-price --help > /dev/null
      - name: Run python-gated test suites
        env:
          CARGO_TERM_COLOR: always
        run: |
          # tee the output so the skip-marker check below inspects THIS
          # run (a rerun inside an `if` would mask test failures and
          # cover only one suite — review catch).
          set -o pipefail
          cargo test -p rustledger --test integration_test --test bean_price_compat -- --nocapture 2>&1 | tee /tmp/gated-tests.log
          cargo test -p rustledger-core --test synthetic_generation -- --nocapture 2>&1 | tee -a /tmp/gated-tests.log
      - name: Fail on silent skips
        run: |
          # Every gated suite prints a recognizable marker when it skips;
          # any of them appearing means an availability probe drifted
          # despite the assert step above.
          if grep -Eq "Skipping: Python beancount not available|bean-check not found, skipping|skipping bean-price compat" /tmp/gated-tests.log; then
            echo "::error::python-gated tests skipped despite the tools being installed — availability probe drifted"
            exit 1
          fi
