# Miri - detect undefined behavior in unsafe code
#
# First-party crates are all #![forbid(unsafe_code)], so this targets UB hit
# through transitive deps (rayon, parking_lot, rkyv, ...) by our call patterns
# (#1239). Runs weekly (too slow for every PR) on the pure-logic crates that
# are miri-compatible; WASM/FFI crates and fs/wasmtime-heavy crates are
# excluded because miri can't run their targets.
#
# Memory model: Stacked Borrows (miri's default). Scoped to the rowan-free
# crates because rowan's `ThinArc` green tree trips miri under BOTH Stacked
# Borrows AND Tree Borrows (a known, open aliasing-model question, not a rowan
# bug), so no memory-model flag fixes it. See the run step below for the full
# rationale and upstream references.
#
# One crate per matrix job, each with its own timeout, and proptest targets
# skipped — see the job and run step for why both were necessary to make this
# fit at all.
name: Miri
on:
  schedule:
    # Weekly on Sunday at 5 AM UTC
    - cron: '0 5 * * 0'
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608
jobs:
  miri:
    name: Miri (${{ matrix.crate }})
    runs-on: ubuntu-latest
    # Explicit, because the default is GitHub's 6-hour job cap. Without this the
    # job silently burned all six hours every Sunday and reported `cancelled`
    # (four consecutive weeks, 2026-07-05 through 07-26) — a red X that looks
    # like an infrastructure hiccup rather than "this job no longer fits".
    #
    # One crate per job, so the budget is PER CRATE rather than shared. Run
    # sequentially they contend for a single ceiling, and whichever runs second
    # is starved by whatever the first spent — so a slowdown in `core` reads as
    # a `booking` failure. Splitting also halves wall clock, since the two are
    # independent.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate: [rustledger-core, rustledger-booking]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # nightly
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: miri
      # `+nightly` is required: the repo's rust-toolchain.toml pins `stable`,
      # which otherwise overrides the nightly installed above, and miri only
      # exists on nightly (bare `cargo miri` resolves to stable and fails with
      # "the 'miri' component ... is not available for the 'stable' toolchain").
      - name: Setup Miri
        run: cargo +nightly miri setup
      # Scoped to the rowan-free crates. rustledger-parser and rustledger-query
      # depend on `rowan`, whose green tree is a `ThinArc` (header + slice packed
      # into one allocation). That thin-pointer "header fattening" is rejected by
      # Miri under BOTH Stacked Borrows and Tree Borrows (a write/retag through a
      # pointer not in the borrow stack at SyntaxNode::green().into_owned()).
      # rustledger-parser is #![forbid(unsafe_code)], so this is entirely rowan's
      # internal unsafe, not ours. It's a known, still-open upstream question, not
      # a rowan bug we can fix or upgrade away from:
      #   - https://github.com/rust-analyzer/rowan/issues/108 (open since 2021)
      #   - tied to rust-lang/unsafe-code-guidelines#134 / #256 / #276 (i.e.
      #     github.com/rust-lang/unsafe-code-guidelines/issues/{134,256,276}); the
      #     Rust teams' "general temperature" is that this pattern SHOULD be allowed.
      #   - rowan 0.16.1 is the latest release; no Miri-clean version exists.
      # Tree Borrows does not help (verified), so the established practice for a
      # Miri-incompatible dependency applies: scope Miri away from it. We still
      # catch transitive-`unsafe` UB in our own logic via core + booking (+ their
      # deps: rust_decimal, bigdecimal, imbl, smallvec, ...).
      #
      # HIGH-REPETITION targets are skipped. Miri's cost is per executed step,
      # so repetition — not complexity — is what turns a test into an outage.
      # Two categories, both measured on this job:
      #
      #   proptest!            256+ cases per property. On 2026-06-28 one
      #                        18-test binary took 5,951s and another 1,730s;
      #                        a 500-case property then pushed the job past six
      #                        hours every week.
      #   spec/tla/behaviors   TLA+ corpus replay: 33,772 transitions across 11
      #                        specs. 1.03s natively, still unfinished after 57
      #                        minutes under Miri on 2026-07-31, starving the
      #                        target queued behind it.
      #
      # Two obvious alternatives do NOT work, which is why the skip is shaped
      # this way rather than as a knob:
      #
      #   `PROPTEST_CASES` is ignored — every binary calls
      #   `ProptestConfig::with_cases(N)`, i.e. `Config { cases: N,
      #   ..Config::default() }`, so the literal overwrites the env-derived
      #   default. Setting it would look like a fix and change nothing.
      #
      #   Filtering by test NAME misses four properties that are not `prop_*`
      #   prefixed (`try_reduce_predicts_reduce`,
      #   `interpolation_is_idempotent_*`, `interpolated_transaction_has_zero_residual`).
      #
      # So the list is DERIVED from file contents, never hardcoded: a new suite
      # of either kind is handled without editing this file, and a new ordinary
      # test is picked up automatically. A hardcoded allowlist would mean a
      # future test file silently never runs under Miri — the failure mode this
      # job spent eight weeks demonstrating.
      #
      # Coverage cost is small. Neither crate has a `proptest!` in `src/`, so
      # the unit tests — where the transitive `unsafe` actually lives (imbl,
      # smallvec, rust_decimal) — all still run. Both categories keep full
      # strength in the normal test suite, and TLA+ conformance is owned by
      # tla.yml regardless.
      - name: Run Miri on ${{ matrix.crate }}
        run: |
          set -euo pipefail
          crate="${{ matrix.crate }}"

          # Skip markers and rationale: see the comment block above this step.
          targets=(--lib)
          for f in "crates/$crate/tests/"*.rs; do
            [ -e "$f" ] || continue
            name="$(basename "$f" .rs)"
            if grep -q 'proptest!' "$f"; then
              echo "skipping $crate/$name (proptest: repetition too costly under Miri)"
            elif grep -q 'spec/tla/behaviors' "$f"; then
              echo "skipping $crate/$name (TLA+ corpus replay: repetition too costly under Miri)"
            else
              targets+=(--test "$name")
            fi
          done

          echo "running: cargo miri test -p $crate ${targets[*]}"
          # Backstop: a per-invocation cap so the NEXT unexpectedly slow target
          # is named and killed rather than silently eating the job budget the
          # way tla_behavior_replay did. Deliberately fails rather than warning
          # — a target too slow to run is a decision for a human, and a silent
          # skip here is exactly how this job stayed dark for eight weeks.
          # `rc=$?` inside `if ! cmd` would capture the NEGATION's status (0),
          # not the command's — so the timeout branch below would never fire.
          rc=0
          timeout --signal=INT 2400 cargo +nightly miri test \
            --package "$crate" --all-features "${targets[@]}" || rc=$?
          if [ "$rc" -ne 0 ]; then
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 130 ]; then
              echo "::error::Miri exceeded 40 minutes on $crate. Find which target"
              echo "::error::is responsible in the log above and either optimize it or"
              echo "::error::add a skip marker to the derivation in this workflow."
            fi
            exit "$rc"
          fi
        env:
          # -Zmiri-disable-isolation: some tests read the realtime clock
          # (e.g. "today"-based date helpers), which miri rejects under its
          # default isolation ("clock_gettime ... not available when isolation
          # is enabled"). Disabling isolation lets those tests run; it only
          # permits host clock/entropy access and does not weaken miri's
          # UB/aliasing checks, which is what this job is for.
          MIRIFLAGS: -Zmiri-symbolic-alignment-check -Zmiri-strict-provenance -Zmiri-disable-isolation
      - name: Summary
        run: |
          {
            echo "## Miri: ${{ matrix.crate }}"
            echo ""
            echo "Memory model: Stacked Borrows (miri default)."
            echo ""
            echo "Excluded crates — rowan's ThinArc is miri-incompatible under Stacked AND Tree Borrows: rustledger-parser, rustledger-query."
            echo ""
            echo "High-repetition targets are skipped (see the run step): proptest binaries at 256+ cases, and TLA+ corpus replay at 33,772 transitions. Miri's cost is per executed step, so repetition is what turns a test into an outage. Both keep full strength in the normal test suite; neither crate has a \`proptest!\` in \`src/\`, so the unit tests still run here, and TLA+ conformance is owned by tla.yml."
          } >> "$GITHUB_STEP_SUMMARY"
