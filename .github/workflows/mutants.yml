# Mutation-testing audit (cargo-mutants) over a curated set of crates.
#
# This is a periodic AUDIT, not a PR gate. Runs are slow (~10-60 min per
# crate) and surviving ("missed") mutants are reviewed by hand: each one
# either gets a test that kills it, or an annotation in .cargo/mutants.toml
# explaining why it is un-killable (usually dead code that should go).
#
# See issue #1238. Filtering config lives in .cargo/mutants.toml.
name: Mutants

on:
  schedule:
    - cron: '0 4 * * 1' # Weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutants (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # Audit every crate even if one finds survivors / times out.
      fail-fast: false
      matrix:
        package:
          - rustledger-core
          - rustledger-parser
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      - uses: taiki-e/install-action@7be9fd86bd1707236395105d6e9329dd1511a7e1 # v2.79.0
        with:
          tool: cargo-mutants

      - name: Run mutation testing
        # This is an audit, not a gate: surviving mutants and timeouts make
        # cargo-mutants exit non-zero, but we still want the report — so the
        # job itself does not fail on them. A real baseline build/test
        # failure surfaces as all-zero counts in the summary below.
        run: cargo mutants --package ${{ matrix.package }} --no-shuffle --jobs 2 || true

      - name: Summarize surviving mutants
        if: always()
        run: |
          out=mutants.out
          count() { if [ -f "$out/$1" ]; then wc -l < "$out/$1" | tr -d ' '; else echo 0; fi; }
          caught=$(count caught.txt)
          missed=$(count missed.txt)
          timeout=$(count timeout.txt)
          unviable=$(count unviable.txt)
          {
            echo "## Mutants: ${{ matrix.package }}"
            echo ""
            echo "| outcome | count |"
            echo "|---|---|"
            echo "| caught (killed) | $caught |"
            echo "| **missed (survived)** | **$missed** |"
            echo "| timeout | $timeout |"
            echo "| unviable | $unviable |"
            echo ""
            if [ "$missed" -gt 0 ]; then
              echo "<details><summary>Surviving mutants — review: add a test, or annotate in .cargo/mutants.toml</summary>"
              echo ""
              echo '```'
              cat "$out/missed.txt"
              echo '```'
              echo "</details>"
            elif [ "$caught" -eq 0 ]; then
              echo "⚠️ No mutants were run — check the baseline built and tested cleanly (see the artifact)."
            else
              echo "✅ No surviving mutants."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-${{ matrix.package }}
          path: mutants.out/
          retention-days: 30
