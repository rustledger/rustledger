# Mutation Testing with cargo-mutants
#
# Mutation testing injects bugs into the code and checks if tests catch them.
# This finds undertested code that coverage metrics miss.
#
# Runs on:
# - Monthly schedule (1st of each month)
# - PR changes to core crates and critical pipeline crates
# - Manual trigger with configurable packages
#
# Each package is mutated in its OWN matrix job (#1238): the curated audit set
# (core + parser + pipeline) is several thousand mutants, far more than one
# 180-minute runner can finish — a single combined job would hit the timeout
# and fail. Per-package jobs run in parallel, each with its own time budget.
#
# See: https://mutants.rs/
#
name: Mutation Testing
on:
  schedule:
    # Monthly on 1st at 6 AM UTC
    - cron: '0 6 1 * *'
  pull_request:
    paths:
      # TLA+-verified modules (inventory, booking, validation)
      - 'crates/rustledger-core/src/inventory/**'
      - 'crates/rustledger-booking/src/**'
      - 'crates/rustledger-validate/src/**'
      # Critical pipeline crates (#774, #775, #776)
      - 'crates/rustledger-loader/src/**'
      - 'crates/rustledger-plugin/src/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to test (comma-separated, or "all")'
        required: false
        default: 'rustledger-core'
        type: string
      timeout:
        description: 'Timeout per mutant in seconds'
        required: false
        # 300 -> 180. Measured on run 30785409699: the four parser shards run
        # DISJOINT slices of the mutant list (that is what `--shard k/n` does)
        # and the slices are equal in SIZE — 459 mutants each — yet they took
        # 36 / 53 / 63 / 93 minutes. Equal work by count, very unequal by
        # clock. Duration tracks TIMEOUTS: shard 3/4 spent 8 x 300s, about 40
        # of its 93 minutes, waiting on mutants that hang. See the
        # `shards_for` note below for why re-sharding is the wrong lever.
        #
        # 180s is 180x the measured baseline TEST — `Unmutated baseline in
        # 113s build + 1s test`, and `--timeout` bounds the test phase, not
        # the build (`--build-timeout` is separate) — so a legitimate test has
        # enormous room.
        #
        # The failure direction is safe: the score is
        # CAUGHT / (CAUGHT + MISSED + TIMEOUT), so a TIMEOUT sits in the
        # denominator only. Cutting this too far makes the score DROP, which is
        # loud — the opposite of the memory cap in #1928, where too tight would
        # have silently inflated it.
        #
        # WHY 180 AND NOT 120. 120 was tried first (run 30876745352) and was
        # measurably too aggressive. It took the worst shard 93 -> 78 minutes,
        # but its timeouts went 8 -> 12: four mutants that previously COMPLETED
        # and were scored now expire instead. A TIMEOUT is not a CAUGHT, so
        # those four moved from the numerator to the denominator and the shard
        # score fell 84.2% -> 83.1% without any test getting worse. That is a
        # false signal, in the safe direction but still false.
        #
        # 180 sits above the four (they finish between 120s and 300s) while
        # still cutting the eight genuine hangs from 300s. Re-measure if the
        # timeout count moves off 8 again: it is the tell that this number is
        # in the wrong place.
        default: '180'
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  # Select the package set for this run and emit it as a JSON array, so the
  # `mutants` job can fan out one runner per package.
  select-packages:
    name: Select packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        run: |
          INPUT="${{ github.event.inputs.packages || '' }}"
          # Curated audit set: core + parser + the critical pipeline crates
          # (CLI, LSP and WASM are intentionally excluded — too slow / not the
          # correctness-critical core).
          ALL='rustledger-core rustledger-parser rustledger-booking rustledger-validate rustledger-loader rustledger-plugin'
          if [ "$INPUT" = "all" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            PACKAGES="$ALL"
          elif [ -n "$INPUT" ]; then
            PACKAGES=$(printf '%s' "$INPUT" | tr ',' ' ')
          else
            # pull_request (path-triggered): curated default.
            PACKAGES='rustledger-core'
          fi

          # SHARD COUNT PER PACKAGE, from measured wall-clock on the
          # 2026-08-01 run: core 162min, parser 81min AND KILLED before
          # finishing, everything else under 20. One runner per package meant
          # the two big crates either ran to the cap or were lost whole, so
          # their results were a lower bound rather than an answer — a full
          # local sweep of ONE parser file found 127 surviving mutants where
          # the crate-wide CI run had ever reported 69.
          #
          # Sharding splits the mutant list, so each job finishes well inside
          # the cap and a lost runner costs one shard instead of a crate.
          # NOT raised further on purpose. The obvious reading of a 93-minute
          # shard is "split it more", and that is wrong here. The shards already
          # hold disjoint slices of EQUAL SIZE (459 mutants each), so the
          # 36-to-93-minute spread is not workload imbalance to be divided
          # away. It is timeouts (0 / 1 / 7 / 8 across the four) plus how many
          # mutants are unviable and therefore free (146 on the fastest, 34 on
          # the slowest). More shards would make each slice smaller but
          # multiply the fixed ~113s baseline build per runner, and the
          # timeouts would simply redistribute across them.
          #
          # Headroom is also better than it looks: 93 minutes against a
          # 240-minute cap. Revisit if a shard passes ~180.
          shards_for() {
            case "$1" in
              rustledger-core|rustledger-parser) echo 4 ;;
              *) echo 1 ;;
            esac
          }

          # PARALLEL CARGO JOBS PER SHARD. `rustledger-parser` gets fewer.
          # Measured on run 30765289550: three of its four shards were
          # SIGTERMed by the runner at 32-47 minutes (exit 143, "runner has
          # received a shutdown signal") while all four `core` shards of the
          # same duration finished. The parser's suite is the heavy one
          # (proptest, fuzz-corpus replay, insta snapshots), so four concurrent
          # test binaries is the likelier cause than runner flakiness. Halving
          # it spends wall-clock that sharding has freed up.
          jobs_for() {
            case "$1" in
              rustledger-parser) echo 2 ;;
              *) echo 4 ;;
            esac
          }

          # SHARD INDICES ARE ZERO-BASED: `--shard k/n` wants k in 0..n-1.
          # cargo-mutants' own `--help` says "specify as e.g. 1/4", which reads
          # as one-based and is not. Verified against cargo-mutants 27.1.0 on a
          # 93-mutant crate: shards 0,1,2 of 3 return 31 each and partition the
          # list exactly, while `3/3` returns NOTHING and runs green. Numbering
          # from 1 therefore skips the whole k=0 shard and reports success for
          # an empty one - a quarter of the crate silently untested. The guard
          # in the run step exists because that failure is invisible otherwise.
          ENTRIES=''
          for pkg in $PACKAGES; do
            [ -n "$pkg" ] || continue
            n=$(shards_for "$pkg")
            i=0
            while [ "$i" -lt "$n" ]; do
              ENTRIES="$ENTRIES{\"package\":\"$pkg\",\"shard\":$i,\"shards\":$n,\"jobs\":$(jobs_for "$pkg")},"
              i=$((i + 1))
            done
          done
          MATRIX="[${ENTRIES%,}]"
          echo "Selected: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  mutants:
    name: Mutate ${{ matrix.package }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: select-packages
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      # One package's timeout/failure must not cancel the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-packages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: mutants-${{ matrix.package }}
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutation testing
        run: |
          TIMEOUT="${{ github.event.inputs.timeout || '300' }}"
          echo "Mutating package: ${{ matrix.package }}"
          echo "Shard: ${{ matrix.shard }} of ${{ matrix.shards }}"
          echo "Parallel cargo jobs: ${{ matrix.jobs }}"
          echo "Timeout per mutant: ${TIMEOUT}s"
          echo ""

          # WHY THIS SAMPLER EXISTS
          #
          # `rustledger-parser` shards keep dying with exit 143 (SIGTERM) plus
          # "The runner has received a shutdown signal", 25-47 minutes into a
          # 240-minute budget. That is the runner VM going away underneath us,
          # not our own timeout and not a cargo-mutants failure.
          #
          # Two rounds of fixes were aimed at guesses. `--jobs 4 -> 2` (run
          # 30765289550) and the convert.rs unbounded-loop fix (#1926) each
          # recovered some shards and left others dying, which is what you get
          # from treating a symptom you cannot see. NOTHING in the job records
          # disk or memory, so the logs cannot distinguish the candidates:
          #
          #   disk        cargo-mutants keeps one full build tree PER --jobs
          #               slot, and the runner documents only ~14 GB free.
          #               Measured locally at 1.7 GB for two slots, so this is
          #               the WEAKEST of the three - but "weakest" was measured
          #               on a short run, and it costs nothing to sample.
          #   memory      several concurrent rustc/test processes. The parser
          #               suite is the heavy one (proptest, fuzz-corpus replay,
          #               insta), which fits the fact that only this package
          #               dies. Leading candidate.
          #   infra       GitHub reclaiming the VM, nothing to do with us.
          #
          # The sampler writes to STDOUT on purpose. When the VM is reclaimed
          # the post-job steps are skipped and the artifact upload never runs
          # (that is why every previous failure uploaded nothing), but the log
          # stream is preserved right up to the kill. Stdout is the only
          # channel that survives the failure being diagnosed.
          #
          # Read it with: grep '^RESOURCE' in the failed job's log. The last
          # line before the kill is the verdict. If free disk or free memory
          # is collapsing, it is ours to fix; if both look healthy, it is
          # infrastructure and the fix is retry/self-hosted, not more tuning.
          # cargo-mutants scratch lives at $TMPDIR/cargo-mutants-<dir>-*.tmp,
          # one per --jobs slot, and is removed on exit. Verified against
          # cargo-mutants 27.1.0.
          #
          # EVERY sample below is failure-proofed with `|| true`, and the
          # subshell turns `set -e` OFF. That is not defensive padding, it is
          # the bug this sampler was born with: the step runs under bash
          # `-eo pipefail`, the scratch glob matches nothing until cargo-mutants
          # has started, so `du` exits 1, so the assignment exits 1, so `set -e`
          # killed the sampler on its FIRST iteration. It produced no output at
          # all, which is the one failure mode an instrument must not have -
          # a silent no-op looks exactly like "nothing to report". Caught by
          # running the block standalone before pushing it.
          (
            set +e
            while true; do
              root_avail=$(df -m --output=avail / 2>/dev/null | tail -1 | tr -d ' ' || true)
              tmp_avail=$(df -m --output=avail "${TMPDIR:-/tmp}" 2>/dev/null | tail -1 | tr -d ' ' || true)
              mem_avail=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo 2>/dev/null || true)
              swap_free=$(awk '/SwapFree/ {print int($2/1024)}' /proc/meminfo 2>/dev/null || true)
              scratch=$({ du -sm "${TMPDIR:-/tmp}"/cargo-mutants-*.tmp 2>/dev/null || true; } \
                | awk '{s+=$1} END {print s+0}' || true)
              # Name the heaviest processes, not just the shortfall. "memory
              # ran out" does not tell you what to change; "two rustc at 3 GB
              # each" says lower --jobs, and "one test binary at 9 GB" says
              # fix the test.
              top=$({ ps -eo rss=,comm= --sort=-rss 2>/dev/null || true; } | head -3 \
                | awk '{printf "%s:%dMB ", $2, $1/1024}' || true)
              echo "RESOURCE t=$(date -u +%H:%M:%S) root_avail_mb=${root_avail:--1}" \
                   "tmp_avail_mb=${tmp_avail:--1} mem_avail_mb=${mem_avail:--1}" \
                   "swap_free_mb=${swap_free:--1} mutants_scratch_mb=${scratch:--1}" \
                   "top_rss=[${top}]"
              sleep 30
            done
          ) &
          SAMPLER_PID=$!
          # Stop sampling however this step ends, so a passing run does not
          # leave a stray process for "Cleaning up orphan processes" to report.
          # `sleep` is a child of the subshell and outlives a bare kill of the
          # parent, so take both.
          #
          # The emptiness guard is about log hygiene, not safety: an unset
          # SAMPLER_PID makes `pkill` print its usage block and `kill` print
          # "not a pid or valid job spec" (verified - neither targets another
          # process). Both would land in the log at exactly the moment this
          # sampler exists to make readable, so keep them out of it.
          trap 'if [ -n "${SAMPLER_PID:-}" ]; then
                  pkill -P "$SAMPLER_PID" 2>/dev/null || true
                  kill "$SAMPLER_PID" 2>/dev/null || true
                fi' EXIT

          # MEMORY CAP - why a mutation job needs one at all.
          #
          # Measured on run 30782530785 with the sampler above. Steady state
          # was ~13.5 GB available; in a single 30-second window it fell to
          # 179 MB with one `rustledger_parser` TEST BINARY at 12048 MB RSS
          # and a second at 3049 MB, on a 16 GB runner. Disk was never a
          # factor (86 GB free throughout). The runner agent was the thing
          # that died, which is why the job reports SIGTERM and a "shutdown
          # signal" rather than any error of ours.
          #
          # This is inherent to mutation testing, not one bad mutant: the tool
          # deliberately compiles broken code, and some of it allocates without
          # bound. `--timeout` only bounds WALL CLOCK, so a mutant that eats
          # 12 GB in well under 300s is never caught by it - it takes the
          # runner down first, losing the whole shard's results including the
          # hundreds of mutants already tested.
          #
          # RLIMIT_AS is inherited by every descendant (cargo, rustc, the test
          # binaries), so the runaway hits an allocation failure and dies as a
          # FAILING TEST - which mutation testing scores as CAUGHT, the correct
          # outcome - instead of killing the VM.
          #
          # WHY 6 GB AND NOT LESS. A cap set near legitimate usage would be
          # WORSE than the crash it prevents: healthy mutants would die on
          # allocation failure and score as CAUGHT, quietly INFLATING the
          # mutation score while testing nothing. A crashed shard is at least
          # loud. So the cap is set roughly 10x above measured honest peak
          # (rustc topped out around 650 MB in the same samples) - high enough
          # that only a genuine runaway can reach it, low enough that two
          # concurrent slots stay inside the 16 GB runner.
          #
          # Verified locally: a full clean build plus the entire
          # `rustledger-parser` suite passes under this exact limit, and a
          # process asking for more gets MemoryError.
          #
          # This bounds ANY SINGLE process, which is the failure that was
          # actually observed. It does not bound the sum, so N slots each
          # legitimately near the cap could still exhaust the VM - not seen in
          # practice (honest peak is ~0.65 GB), but it is why raising this
          # number and raising `jobs_for()` have to be considered together.
          ulimit -v 6291456
          echo "RESOURCE ulimit_v_kb=$(ulimit -v)"

          echo "RESOURCE baseline follows (before any mutant runs)"
          df -h / "${TMPDIR:-/tmp}" | sed 's/^/RESOURCE df /'
          free -m | sed 's/^/RESOURCE free /'
          nproc | sed 's/^/RESOURCE nproc /'

          # `--shard k/n` splits the generated mutant list; every shard still
          # builds the crate once, so this trades a little repeated build time
          # for jobs that actually finish.
          cargo mutants \
            --timeout "$TIMEOUT" \
            --jobs "${{ matrix.jobs }}" \
            --package "${{ matrix.package }}" \
            --shard "${{ matrix.shard }}/${{ matrix.shards }}" \
            -- --all-features \
            2>&1 | tee mutants-output.txt
      - name: Parse results
        id: results
        run: |
          # Extract summary statistics
          if [ -f "mutants.out/caught.txt" ]; then
            CAUGHT=$(wc -l < mutants.out/caught.txt | tr -d ' ')
          else
            CAUGHT=0
          fi

          if [ -f "mutants.out/missed.txt" ]; then
            MISSED=$(wc -l < mutants.out/missed.txt | tr -d ' ')
          else
            MISSED=0
          fi

          if [ -f "mutants.out/timeout.txt" ]; then
            TIMEOUT=$(wc -l < mutants.out/timeout.txt | tr -d ' ')
          else
            TIMEOUT=0
          fi

          TOTAL=$((CAUGHT + MISSED + TIMEOUT))

          # A shard that tested NOTHING is a bug, not a clean bill of health.
          # An out-of-range shard index produces exactly this: cargo-mutants
          # exits 0 having run no mutants, so without the check the job is
          # green and a slice of the crate goes unexamined. Unviable-only is
          # possible in principle, so read the listed count too before failing.
          if [ "$TOTAL" -eq 0 ]; then
            LISTED=$(cargo mutants --package "${{ matrix.package }}" \
              --shard "${{ matrix.shard }}/${{ matrix.shards }}" --list 2>/dev/null \
              | grep -cE '^crates/.*\.rs:[0-9]+:[0-9]+:' || true)
            if [ "${LISTED:-0}" -eq 0 ]; then
              echo "::error::shard ${{ matrix.shard }}/${{ matrix.shards }} of \
          ${{ matrix.package }} generated no mutants at all. Shard indices are \
          ZERO-based (0..n-1); an out-of-range index runs nothing and exits 0."
              exit 1
            fi
          fi

          if [ "$TOTAL" -gt 0 ]; then
            SCORE=$((CAUGHT * 100 / TOTAL))
          else
            SCORE=0
          fi

          echo "caught=$CAUGHT" >> $GITHUB_OUTPUT
          echo "missed=$MISSED" >> $GITHUB_OUTPUT
          echo "timeout=$TIMEOUT" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "score=$SCORE" >> $GITHUB_OUTPUT
      - name: Summary
        run: |
          echo "## Mutation Testing Results — ${{ matrix.package }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Mutation testing injects bugs and checks if tests catch them." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mutants caught (good) | ${{ steps.results.outputs.caught }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mutants missed (bad) | ${{ steps.results.outputs.missed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mutants timeout | ${{ steps.results.outputs.timeout }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | ${{ steps.results.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mutation Score** | **${{ steps.results.outputs.score }}%** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "mutants.out/missed.txt" ] && [ -s "mutants.out/missed.txt" ]; then
            echo "### Missed Mutants (need better tests)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -20 mutants.out/missed.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload mutation results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Per-package AND per-shard: `upload-artifact@v4+` REJECTS a
          # duplicate name outright, so four shards of one package all
          # uploading `mutation-results-<package>` would fail the job (and
          # before v4 would have silently overwritten, losing three quarters
          # of the results, which is worse).
          name: mutation-results-${{ matrix.package }}-shard${{ matrix.shard }}of${{ matrix.shards }}
          path: |
            mutants.out/
            mutants-output.txt
          retention-days: 30
      - name: Check mutation score threshold
        run: |
          SCORE="${{ steps.results.outputs.score }}"
          MISSED="${{ steps.results.outputs.missed }}"
          # PR runs require 75% for core/pipeline modules
          # Non-PR runs (scheduled, manual) require 70%
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            THRESHOLD=75
          else
            THRESHOLD=70
          fi

          if [ "$SCORE" -lt "$THRESHOLD" ]; then
            echo "::warning::[${{ matrix.package }}] Mutation score ($SCORE%) is below threshold ($THRESHOLD%)"
            echo "Consider adding more tests for the $MISSED missed mutants."
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo ""
              echo "Core and pipeline modules require a minimum 75% mutation score."
              echo "Please add tests that catch the missed mutants."
              # Don't fail the workflow, just warn
            fi
          else
            echo "[${{ matrix.package }}] Mutation score ($SCORE%) meets threshold ($THRESHOLD%)"
          fi
      # Per-plugin floor enforcement (Phase 3 of #992 plan, closes #1003).
      #
      # The aggregate threshold above is permissive: it can be satisfied
      # by a few well-tested plugins masking many badly-tested ones.
      # The per-plugin script enforces a tighter floor (default ≤10%
      # survival rate) on EACH plugin file under
      # `crates/rustledger-plugin/src/native/plugins/*.rs`. Infrastructure
      # files (registry, runtime, convert, types) are reported but not
      # enforced — they have a different shape from per-plugin code and
      # need their own threshold conversation.
      #
      # GITHUB_ANNOTATIONS=1 surfaces each surviving mutant as an inline
      # `::warning::` annotation on the PR diff, satisfying the
      # "PR inline comments for surviving mutants" criterion of #1003.
      - name: Per-plugin mutation floor check
        if: matrix.package == 'rustledger-plugin'
        env:
          GITHUB_ANNOTATIONS: '1'
          MUTATION_FLOOR: '10'
        run: scripts/per-plugin-mutation-report.sh

  # A shard the runner TERMINATES produces no result at all: the sweep is cut
  # off mid-list and every later step is skipped, so nothing inside that job
  # can report what happened. From the outside it looks identical to a shard
  # that finished and found problems, and the run's `failure` conclusion means
  # two completely different things -- one is "coverage is imperfect", the
  # other is "we did not measure". Conflating them is how a scheduled job stops
  # being read (see #1907).
  #
  # This runs regardless of the shards' outcome and says which happened.
  summarize:
    name: Mutation summary
    needs: [select-packages, mutants]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Classify each shard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Into RUNNER_TEMP, not the workspace: a file called `jobs.jsonl`
          # sitting at the repo root reads like a checked-in fixture.
          JOBS="$RUNNER_TEMP/mutation-jobs.jsonl"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --paginate --jq '.jobs[] | select(.name | startswith("Mutate"))
              | {name, conclusion, run: ([.steps[] | select(.name=="Run mutation testing") | .conclusion] | first)}' \
            > "$JOBS"

          # Split on whether the sweep step SUCCEEDED. That is the honest
          # distinction available here: a shard whose sweep did not succeed
          # produced no numbers, whether the runner killed it (exit 143, the
          # observed case) or cargo-mutants itself failed. Both mean "not
          # measured"; neither means "mutants survived", because a shard that
          # completes with survivors still exits 0. The conclusions are printed
          # so the reader can tell which happened rather than being told.
          measured=$(jq -r 'select(.run=="success") | .name' "$JOBS" | wc -l | tr -d ' ')
          incomplete=$(jq -r 'select(.run!="success") | .name' "$JOBS" | wc -l | tr -d ' ')
          total=$((measured + incomplete))

          {
            echo "## Mutation run"
            echo ""
            echo "| shards | outcome |"
            echo "|---:|---|"
            echo "| $measured | measured (the sweep finished) |"
            echo "| $incomplete | **did not complete the sweep** (no result; NOT surviving mutants) |"
            echo ""
            if [ "$incomplete" -gt 0 ]; then
              echo "Shards that measured nothing:"
              echo ""
              jq -r 'select(.run!="success")
                | "- `\(.name)` — job `\(.conclusion)`, sweep step `\(.run // "did not run")`"' "$JOBS"
              echo ""
              echo "Re-run these before reading the numbers as coverage: a shard"
              echo "that stopped early reports no surviving mutants simply because"
              echo "it never reached them. Every occurrence so far has been the"
              echo "runner terminating the job (exit 143), which is infrastructure"
              echo "rather than a finding."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "measured=$measured incomplete=$incomplete of $total"

          # Fail when a sweep did not complete, so the run's conclusion means
          # "incomplete", which is true and actionable. Surviving mutants alone
          # do not fail a shard, so this swallows nothing.
          if [ "$incomplete" -gt 0 ]; then
            echo "::error::$incomplete of $total shards did not complete their sweep and measured nothing."
            exit 1
          fi
