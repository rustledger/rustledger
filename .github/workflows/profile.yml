# Nightly heap profiling — surfaces allocation hotspots in the load → process
# pipeline so we can spot optimization opportunities. Complements `bench.yml`
# (wall-clock timing / regressions); this answers "where do the allocations
# come from". Advisory only — uploads an artifact, never gates merges.
#
# Slice 1 (this file): a `dhat` heap profile of `examples/profile_pipeline`
# over a generated ledger, uploaded as an artifact. Future slices may add
# flamegraphs, iai-callgrind instruction counts, and a `profiling` data branch
# for night-over-night trends.
name: Profile

on:
  schedule:
    - cron: "0 3 * * *" # Nightly at 3 AM UTC (offset from bench.yml's 2 AM)
  workflow_dispatch:
    inputs:
      transactions:
        description: "Number of transactions in the generated workload"
        default: "10000"

# Profiling runs are independent; never cancel an in-flight one.
concurrency:
  group: profiling
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  profile:
    name: Profile — heap + CPU (load + process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Generate workload ledger
        env:
          TXNS: ${{ github.event.inputs.transactions || '10000' }}
        run: |
          python3 - "$TXNS" > workload.beancount <<'PY'
          import sys, random, datetime
          random.seed(42)
          n = int(sys.argv[1])
          accounts = ["Assets:Bank:Checking", "Assets:Bank:Savings",
                      "Expenses:Food", "Expenses:Rent", "Income:Salary",
                      "Liabilities:CreditCard"]
          print('option "title" "Profiling Workload"')
          print('option "operating_currency" "USD"')
          for a in accounts:
              print(f"2020-01-01 open {a} USD")
          print()
          d = datetime.date(2020, 1, 2)
          for i in range(n):
              d += datetime.timedelta(days=1)
              src, dst = random.choice(accounts), random.choice(accounts)
              amt = round(random.uniform(1, 500), 2)
              print(f'{d.isoformat()} * "Payee {i}" "memo {i}"')
              print(f"  {src}  -{amt} USD")
              print(f"  {dst}   {amt} USD")
          PY
          echo "workload: $(wc -l < workload.beancount) lines"

      - name: Build profiling harness
        run: cargo build -p rustledger --profile profiling --example profile_pipeline --features dhat-heap

      - name: Run heap profile
        run: ./target/profiling/examples/profile_pipeline workload.beancount

      - name: Build CPU-flamegraph harness
        run: cargo build -p rustledger --profile profiling --example flamegraph_pipeline --features flamegraph

      - name: Run CPU profile (flamegraph)
        # In-process sampling (pprof) — no `perf` privileges needed. Loop the
        # pipeline so the 1 kHz sampler collects enough samples.
        run: ./target/profiling/examples/flamegraph_pipeline workload.beancount 50

      - name: Summarize
        run: |
          {
            echo "## Nightly profile — load + process"
            echo ""
            echo "- Workload: \`$(wc -l < workload.beancount)\` lines"
            echo "- Heap: \`dhat-heap.json\` ($(du -h dhat-heap.json | cut -f1)) — open at <https://nnethercote.github.io/dh_view/> (where the bytes go)"
            echo "- CPU: \`flamegraph.svg\` ($(du -h flamegraph.svg | cut -f1)) — open in a browser (where the time goes)"
            echo ""
            echo "Download the **nightly-profile** artifact for both — the hottest call paths are the optimization targets."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-profile
          path: |
            dhat-heap.json
            flamegraph.svg
            workload.beancount
          retention-days: 30

  # Deterministic instruction count via cachegrind (Valgrind). Counts every
  # instruction the load → process pipeline executes — identical run-to-run, so
  # diffable night-over-night unlike wall-clock. Reuses the `profile_pipeline`
  # binary built WITHOUT dhat (for a clean count); no crate dep, no runner.
  cachegrind:
    name: Instruction counts (cachegrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Generate workload ledger
        env:
          TXNS: ${{ github.event.inputs.transactions || '10000' }}
        run: |
          python3 - "$TXNS" > workload.beancount <<'PY'
          import sys, random, datetime
          random.seed(42)
          n = int(sys.argv[1])
          accounts = ["Assets:Bank:Checking", "Assets:Bank:Savings",
                      "Expenses:Food", "Expenses:Rent", "Income:Salary",
                      "Liabilities:CreditCard"]
          print('option "title" "Profiling Workload"')
          print('option "operating_currency" "USD"')
          for a in accounts:
              print(f"2020-01-01 open {a} USD")
          print()
          d = datetime.date(2020, 1, 2)
          for i in range(n):
              d += datetime.timedelta(days=1)
              src, dst = random.choice(accounts), random.choice(accounts)
              amt = round(random.uniform(1, 500), 2)
              print(f'{d.isoformat()} * "Payee {i}" "memo {i}"')
              print(f"  {src}  -{amt} USD")
              print(f"  {dst}   {amt} USD")
          PY
          echo "workload: $(wc -l < workload.beancount) lines"
      - name: Build harness (no dhat — clean instruction count)
        run: cargo build -p rustledger --profile profiling --example profile_pipeline
      - name: Run cachegrind
        run: |
          valgrind --tool=cachegrind --cachegrind-out-file=cachegrind.out \
            ./target/profiling/examples/profile_pipeline workload.beancount 2> cachegrind.txt
          grep -E "I +refs:" cachegrind.txt
      - name: Summarize
        run: |
          {
            echo "## Nightly instruction count (cachegrind)"
            echo ""
            echo '```'
            grep -E "I +refs:|I1 +misses:|LLi +misses:|D +refs:" cachegrind.txt
            echo '```'
            echo ""
            echo "Deterministic (machine-independent) total instructions for the load → process pipeline — diff night-over-night to catch regressions. \`cg_annotate cachegrind.out\` breaks it down by function."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cachegrind profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cachegrind-instructions
          path: |
            cachegrind.out
            cachegrind.txt
          retention-days: 30

  # Append a deterministic data point to the `profiling` data branch each night
  # (mirrors how bench.yml maintains `benchmarks`). Reuses the instruction count
  # from the `cachegrind` job + the heap totals from the `profile` job — no
  # re-running of the tools.
  trend:
    name: Commit trend data point
    needs: [profile, cachegrind]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-profile
          path: dl-profile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cachegrind-instructions
          path: dl-cg
      - name: Append data point to the profiling branch
        env:
          TXNS: ${{ github.event.inputs.transactions || '10000' }}
        run: |
          set -euo pipefail
          # The count is AFTER "refs:" — the line is "==PID== I refs: N", so take
          # the number following the label (not the leading PID).
          INSTR=$(grep -aE "I +refs:" dl-cg/cachegrind.txt | sed -E 's/.*refs:[[:space:]]*([0-9,]+).*/\1/' | tr -d ' ,')
          # heap totals from dhat-heap.json: sum tb (total bytes), tbk (blocks), gb (peak bytes)
          read -r HB HK HP < <(python3 -c "import json;d=json.load(open('dl-profile/dhat-heap.json'));print(sum(p['tb'] for p in d['pps']),sum(p['tbk'] for p in d['pps']),sum(p.get('gb',0) for p in d['pps']))")
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT=$(git rev-parse HEAD)   # the measured commit, from this job's main checkout
          # Operate on the orphan `profiling` branch in a SEPARATE worktree so it
          # never collides with this job's main checkout. Checking it out in
          # place fails with "untracked working tree files would be overwritten
          # by checkout" (the orphan branch's files clash with the working tree).
          git fetch origin profiling
          PROF="$(mktemp -d)"
          # Clean up the worktree even if a later step fails (set -e short-
          # circuits before the explicit removal below).
          trap 'git worktree remove --force "$PROF" 2>/dev/null || true' EXIT
          git worktree add --detach "$PROF" origin/profiling
          mkdir -p "$PROF/latest"
          cp dl-profile/flamegraph.svg dl-profile/dhat-heap.json "$PROF/latest/"
          printf '{"date":"%s","commit":"%s","txns":%s,"instructions":%s,"heap_total_bytes":%s,"heap_peak_bytes":%s,"heap_blocks":%s}\n' \
            "$DATE" "$COMMIT" "$TXNS" "$INSTR" "$HB" "$HP" "$HK" >> "$PROF/history.jsonl"
          git -C "$PROF" config user.name "github-actions[bot]"
          git -C "$PROF" config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only the data-branch files — NOT the downloaded `dl-*` artifact
          # dirs, which `git add -A` would commit into the data branch.
          git -C "$PROF" add history.jsonl latest/
          git -C "$PROF" diff --staged --quiet || git -C "$PROF" commit -m "profiling: nightly data point ($DATE)"
          git -C "$PROF" push origin HEAD:profiling
          git worktree remove --force "$PROF"
