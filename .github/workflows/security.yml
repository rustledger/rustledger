# Security scanning workflow - Secret detection
#
# Note: Other security checks are handled by:
# - quality.yml: cargo-deny (advisories, licenses, bans) on every push and PR
# - supply-chain.yml: cargo-vet, dependency-review, SBOM generation
#
# This workflow runs secret scanning, plus a daily RustSec advisory check
# (`deny-advisories`) so a new advisory against an UNCHANGED Cargo.lock goes
# red on main the day it is published, not at the next PR that happens to
# run quality.yml.
name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
# A new push to a pull request cancels that PR's previous run of this
# workflow: its result is for a commit that can no longer merge, and long jobs
# (mutation shards run up to 4 hours) otherwise hold runners while the new
# commit's required checks queue. Pushes to branches, schedules and manual runs
# are keyed by run id, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # quality.yml's `Cargo Deny` only runs when a push or PR triggers it, and
  # Dependabot bumps that touch only workflows or npm lockfiles do not. A
  # RustSec advisory published against a crate already in Cargo.lock
  # therefore sat unnoticed on main (url RUSTSEC-2026-0592, wasmtime-wasi
  # RUSTSEC-2026-0566) until an unrelated PR failed on it. Advisories only,
  # since bans/licenses/sources cannot change without a Cargo.lock change.
  deny-advisories:
    name: Cargo Deny (advisories, daily)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - name: Check RustSec advisories against the committed Cargo.lock
        run: cargo deny check advisories
  # Secret scanning with gitleaks
  # Skips for Dependabot PRs (no access to GITLEAKS_LICENSE secret)
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    # Skip for Dependabot - it only updates dependencies, not code with secrets
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for scanning
      - name: Run Gitleaks (standalone binary)
        run: |
          version=8.21.2
          checksum=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba

          # Download and verify
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "${checksum}  gitleaks.tar.gz" | sha256sum -c - || exit 1

          # Extract binary only (avoid clobbering LICENSE/README.md)
          tar -xzf gitleaks.tar.gz gitleaks

          # Run scan
          ./gitleaks detect --config .gitleaks.toml --source . --verbose --redact
