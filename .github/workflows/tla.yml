name: TLA+ Model Checking
on:
  push:
    branches: [main]
    paths:
      - 'spec/tla/**'
      # NOTE: was 'crates/rustledger-core/src/inventory.rs' — stale since
      # inventory became a directory, so inventory changes stopped triggering
      # the models at all.
      - 'crates/rustledger-core/src/inventory/**'
      - 'crates/rustledger-booking/src/**'
      - 'scripts/tla-trace-to-test.py'
      - 'scripts/tla-behaviors.py'
      - 'scripts/tla-coverage-check.py'
      - 'scripts/tla-trace-validate.py'
      - 'crates/rustledger-core/examples/conservation_trace_gen.rs'
      - 'spec/tla/behaviors/**'
      - '.github/workflows/tla.yml'
  pull_request:
    paths:
      - 'spec/tla/**'
      # NOTE: was 'crates/rustledger-core/src/inventory.rs' — stale since
      # inventory became a directory, so inventory changes stopped triggering
      # the models at all.
      - 'crates/rustledger-core/src/inventory/**'
      - 'crates/rustledger-booking/src/**'
      - 'scripts/tla-trace-to-test.py'
      - 'scripts/tla-behaviors.py'
      - 'scripts/tla-coverage-check.py'
      - 'scripts/tla-trace-validate.py'
      - 'crates/rustledger-core/examples/conservation_trace_gen.rs'
      - 'spec/tla/behaviors/**'
      - '.github/workflows/tla.yml'
permissions:
  contents: read
env:
  TLA_VERSION: "1.8.0"
jobs:
  model-check:
    name: TLA+ Model Checking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache TLA+ Tools
        id: cache-tla
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/tla2tools.jar
          key: tla-tools-${{ env.TLA_VERSION }}
      - name: Download TLA+ Tools
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/tlaplus/tlaplus/releases/download/v${{ env.TLA_VERSION }}/tla2tools.jar \
            -O ~/tla2tools.jar
      - name: Verify TLA+ Tools
        run: java -jar ~/tla2tools.jar -help | head -5
      # Rust toolchain for the implementation-trace generator (dual-direction
      # validation below).
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0 # pinned stable — bump deliberately, IN LOCKSTEP with rust-toolchain.toml (see #1745, #1750)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # One loop instead of 16 uniform steps: every spec is checked even when
      # an earlier one fails (previously fail-fast masked later spec failures),
      # and each TLC output is teed to tlc-logs/<Spec>.log so counterexamples
      # can be converted into Rust regression-test skeletons below.
      # Fails on spec <-> CI <-> corpus <-> docs drift (orphan configs, specs
      # missing from the loop below, corpora without replay interpreters, ...).
      - name: TLA+ coverage lint
        run: python3 scripts/tla-coverage-check.py
      - name: Model check all specs
        run: |
          SPECS="Conservation DoubleEntry AccountStateMachine Interpolation PadCorrect \
                 FIFOCorrect LIFOCorrect HIFOCorrect MultiCurrency PriceDB \
                 STRICTCorrect AVERAGECorrect NONECorrect ValidationCorrect \
                 PluginCorrect ConcurrentAccess QueryExecution"
          mkdir -p tlc-logs
          FAILED=""
          for spec in $SPECS; do
            echo "::group::Checking ${spec}.tla"
            if ! java -XX:+UseParallelGC -Xmx2g \
                -jar ~/tla2tools.jar \
                -config "spec/tla/${spec}.cfg" \
                -workers auto \
                -deadlock \
                "spec/tla/${spec}.tla" 2>&1 | tee "tlc-logs/${spec}.log"; then
              FAILED="$FAILED ${spec}"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::TLC found violations in:${FAILED}"
            exit 1
          fi
      # Model-based-testing lockstep: the committed behavior corpus
      # (spec/tla/behaviors/*.json, replayed exhaustively by
      # crates/rustledger-core/tests/tla_behavior_replay.rs in plain `cargo
      # test`) must be regenerable byte-for-byte from the spec. A drift means
      # the spec changed without regenerating the corpus — the replay test
      # would silently keep certifying conformance against the OLD model.
      - name: Verify behavior corpora are in lockstep with the specs
        run: |
          python3 scripts/tla-behaviors.py --self-test
          mkdir -p /tmp/behaviors-check
          STALE=""
          for corpus in spec/tla/behaviors/*.json; do
            spec=$(basename "$corpus" .json)
            java -XX:+UseParallelGC -Xmx2g \
              -jar ~/tla2tools.jar \
              -config "spec/tla/${spec}.cfg" \
              -workers auto \
              -deadlock \
              -dump dot,actionlabels "/tmp/behaviors-check/${spec}" \
              "spec/tla/${spec}.tla" > /dev/null
            python3 scripts/tla-behaviors.py --spec "$spec" \
              < "/tmp/behaviors-check/${spec}.dot" \
              > "/tmp/behaviors-check/${spec}.json"
            if ! diff -u "$corpus" "/tmp/behaviors-check/${spec}.json"; then
              STALE="$STALE ${spec}"
            fi
          done
          if [ -n "$STALE" ]; then
            echo "::error::stale behavior corpora:${STALE} — regenerate (see scripts/tla-behaviors.py docstring)"
            exit 1
          fi
      # Dual-direction refinement check: the behavior-replay suite verifies
      # model -> implementation (every model behavior is implemented
      # correctly, exhaustively); this step verifies implementation -> model
      # (sampled): random op sequences are driven through the REAL Inventory
      # and TLC checks that every recorded transition satisfies
      # Conservation.tla's Next relation. A transition the model forbids
      # fails the ConformsToConservation action property. The seed varies per
      # run (continuous sampling) and is printed for exact reproduction; the
      # validator self-test first proves the harness rejects violations.
      - name: Validate implementation traces against the spec
        env:
          TLC_CMD: java -XX:+UseParallelGC -Xmx2g -jar /home/runner/tla2tools.jar
        run: |
          python3 scripts/tla-trace-validate.py --self-test
          cargo run -q -p rustledger-core --example conservation_trace_gen --             --count 24 --max-units 3 --max-ops 8 --seed "${{ github.run_id }}"             | python3 scripts/tla-trace-validate.py
      # The counterexample-driven workflow from the formal-verification
      # roadmap: every TLC error trace becomes a pinned Rust regression-test
      # skeleton (the process that produced tla_fifo_bug_test.rs). Skeletons
      # land in the job summary and the artifact below.
      - name: Convert counterexamples to Rust test skeletons
        if: failure()
        run: |
          python3 scripts/tla-trace-to-test.py --self-test
          for log in tlc-logs/*.log; do
            spec=$(basename "$log" .log)
            if grep -q '^Error:' "$log"; then
              out="tlc-logs/tla_$(echo "$spec" | tr '[:upper:]' '[:lower:]')_bug_test.rs"
              if python3 scripts/tla-trace-to-test.py --spec "$spec" < "$log" > "$out"; then
                {
                  echo "### ${spec}.tla counterexample → Rust test skeleton"
                  echo '```rust'
                  cat "$out"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done
      - name: Upload counterexample traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tla-traces
          path: |
            tlc-logs/
            *.trace
          if-no-files-found: ignore
      - name: Summary
        if: always()
        run: |
          echo "## TLA+ Model Checking Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All specifications verified with TLC model checker." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Specification | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Conservation.tla | Units conservation invariant |" >> $GITHUB_STEP_SUMMARY
          echo "| DoubleEntry.tla | Double-entry accounting |" >> $GITHUB_STEP_SUMMARY
          echo "| AccountStateMachine.tla | Account lifecycle |" >> $GITHUB_STEP_SUMMARY
          echo "| Interpolation.tla | NULL posting interpolation |" >> $GITHUB_STEP_SUMMARY
          echo "| FIFOCorrect.tla | FIFO selects oldest lot |" >> $GITHUB_STEP_SUMMARY
          echo "| LIFOCorrect.tla | LIFO selects newest lot |" >> $GITHUB_STEP_SUMMARY
          echo "| HIFOCorrect.tla | HIFO selects highest cost lot |" >> $GITHUB_STEP_SUMMARY
          echo "| MultiCurrency.tla | Multi-currency conservation |" >> $GITHUB_STEP_SUMMARY
          echo "| PriceDB.tla | Price database consistency |" >> $GITHUB_STEP_SUMMARY
          echo "| STRICTCorrect.tla | STRICT requires exactly one lot |" >> $GITHUB_STEP_SUMMARY
          echo "| AVERAGECorrect.tla | AVERAGE weighted cost basis |" >> $GITHUB_STEP_SUMMARY
          echo "| NONECorrect.tla | NONE allows any reduction |" >> $GITHUB_STEP_SUMMARY
          echo "| ValidationCorrect.tla | Balance assertion validation |" >> $GITHUB_STEP_SUMMARY
          echo "| PluginCorrect.tla | Plugin execution ordering |" >> $GITHUB_STEP_SUMMARY
          echo "| ConcurrentAccess.tla | Concurrent read/write safety |" >> $GITHUB_STEP_SUMMARY
          echo "| QueryExecution.tla | BQL query execution invariants |" >> $GITHUB_STEP_SUMMARY
