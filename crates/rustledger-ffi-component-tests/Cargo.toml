[package]
name = "rustledger-ffi-component-tests"
description = "Parity tests: WIT component output vs the JSON-RPC surface (#1384)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]

[dev-dependencies]
# Track the workspace wasmtime version (adds the component-model feature on top)
# so these pins can't drift from the root Cargo.toml.
wasmtime = { workspace = true, features = ["component-model"] }
wasmtime-wasi.workspace = true
anyhow = "1"
tempfile.workspace = true
rustledger-booking.workspace = true
rustledger-core.workspace = true
rustledger-ffi-wasi.workspace = true
rustledger-importer = { workspace = true, features = ["toml-config"] }
rustledger-ops.workspace = true
rustledger-query.workspace = true
rustledger-returns.workspace = true
rustledger-budget.workspace = true

[lints]
workspace = true
