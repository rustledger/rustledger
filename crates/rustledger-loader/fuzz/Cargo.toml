[package]
name = "rustledger-loader-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.rustledger-loader]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_options"
path = "fuzz_targets/fuzz_options.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_include_path"
path = "fuzz_targets/fuzz_include_path.rs"
test = false
doc = false
bench = false
