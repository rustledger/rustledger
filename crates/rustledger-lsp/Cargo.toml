[package]
name = "rustledger-lsp"
# Lockstep with the workspace, like every other crate.
#
# This release DOES carry a breaking change to this crate's public API —
# `uri_to_path`/`path_to_uri` went from `Option<PathBuf>` to
# `Result<AbsPathBuf, PathUriError>` — and an earlier version of this line said
# 0.22.0 to signal it. That does not work here: the release cut runs
# `cargo set-version` over the whole workspace, so a hand-written version is
# overwritten with whatever the tag says. The only effect was to invite a
# downstream `rustledger-lsp = "0.22"` pin that no published crate would ever
# satisfy. The break belongs in the release notes, which is where this repo's
# consumers actually learn about one.
version = "0.22.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Language Server Protocol implementation for Beancount"
keywords = ["beancount", "lsp", "language-server", "accounting"]
categories = ["development-tools", "text-editors"]

[dependencies]
# LSP framework
lsp-server.workspace = true
lsp-types.workspace = true
# THE file-URI implementation. `lsp-types` 0.97 dropped `url::Url` for
# `fluent_uri`, which has no path conversion; see `uri_to_path`.
url.workspace = true
percent-encoding.workspace = true

# Document management
ropey.workspace = true

# Line-based diffing for textDocument/formatting edits
similar.workspace = true

# Concurrency
crossbeam-channel.workspace = true
parking_lot.workspace = true

# Our crates
rustledger-parser.workspace = true
rustledger-core.workspace = true
rustledger-completion.workspace = true
rustledger-loader = { workspace = true, features = ["plugins", "validation"] }
rustledger-booking.workspace = true
rustledger-validate.workspace = true
rustledger-plugin.workspace = true

rust_decimal.workspace = true

# Utilities
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
jiff.workspace = true
# Glob-aware `include` document links (issue #1647): match the loader's
# glob-expanding include resolution instead of a literal path-exists check.
glob.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Used by tests/lsp_protocol/harness.rs to deserialize typed LSP request/response
# payloads through `lsp_types::request::Request::Result`. Normal `dependencies`
# only pull serde transitively via `serde_json`, which isn't enough to name the
# `serde::de::DeserializeOwned` trait directly.
serde.workspace = true

[[bin]]
name = "rledger-lsp"
path = "src/main.rs"
