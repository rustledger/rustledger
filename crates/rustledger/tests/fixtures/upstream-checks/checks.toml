[[check]]
id = "manual:beancount.utils.encryption.read_encrypted_file"
status = "covered"
rledger = "rustledger_loader (gpg decryption, LoadError::Decryption)"
test = ["crates/rustledger-loader/src/lib.rs::test_decrypt_gpg_file_missing_gpg"]
note = "Not an error tuple, so the enumeration cannot see it: beancount decrypts a .gpg/.asc ledger by running gpg, and a gpg failure aborts the load. rledger decrypts the same way and reports a failure as a load error."
