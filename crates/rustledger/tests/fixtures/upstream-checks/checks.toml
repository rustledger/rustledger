# Every check beancount 3.2.3 can report to a user, and what rledger does
# about it. See docs/reference/upstream-checks.md for the fields, the
# statuses and how to update this file; the drift guard and the case runner
# are crates/rustledger/tests/upstream_checks_test.rs, and the enumeration
# whose output the `id`s must match is enumerate.py beside this file.

beancount_version = "3.2.3"


# ---- deprecated options ----------------------------------------------------

[[check]]
id = "option-deprecated:allow_deprecated_none_for_tags_and_links"
status = "missing"
case = "grammar-option-deprecated-none-tags"
code = "E7001"
lines = [1]
python_message = "Allowing None for tags and link"
note = "rledger does not know the option and reports it as unknown (E7001) instead of deprecated."

[[check]]
id = "option-deprecated:allow_pipe_separator"
status = "covered"
rledger = "E7004: rustledger_loader::options::deprecation_message"
case = "grammar-option-deprecated-pipe"
code = "E7004"
lines = [1]
python_message = "Allowing pipe separator temporarily"

[[check]]
id = "option-deprecated:inferred_tolerance_multiplier"
status = "covered"
rledger = "E7004: rustledger_loader::options::deprecation_message"
case = "grammar-option-deprecated-tolerance-multiplier"
code = "E7004"
lines = [1]
python_message = "Renamed to 'tolerance_multiplier'."

