# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "wasm32-unknown-unknown",
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

# Unmaintained advisories we accept transitively because removing the
# parent crate isn't actionable today. Re-audit when the upstream crate
# either resumes maintenance or gets a replacement we can adopt.
ignore = [
  # `bitmaps`, reached only as `bitmaps <- imbl <- rustledger-core`.
  # Archived by its owner on 2026-05-03; the advisory is `unmaintained`,
  # not a vulnerability, and there is no known defect to be exposed to.
  #
  # Not actionable from here. `imbl` (the maintained fork of `im`) is
  # itself current at 7.0.1 with no release that drops the dep, and
  # `bitmaps` is its internal chunk bitmap - not a type we hold or pass
  # around, so we cannot swap it for `fixedbitset` / `bitvec` without
  # replacing `imbl` itself. `imbl` backs `Inventory`'s persistent maps,
  # so that is a data-structure change, not a dependency bump.
  #
  # Re-audit when `imbl` releases a version without `bitmaps`, or if this
  # advisory is ever upgraded from `unmaintained` to a vulnerability.
  "RUSTSEC-2026-0247",
]

# rand 0.8.x (via cap-rand/wasmtime-wasi) uses thread_rng which is

[licenses]
version = 2
allow = [
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",            # webpki-roots
  "CC0-1.0",                        # ppmd-rust (zip dependency)
  "bzip2-1.0.6",                    # libbz2-rs-sys (zip dependency)
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Fail CI on new duplicate-version dependencies. Existing dups are in `skip`
# below; this prevents new ones from sneaking in unnoticed.
multiple-versions = "deny"
# Forbid `version = "*"` specs in published crates — they bind to whatever
# happens to resolve at publish time, with no SemVer guard.
wildcards = "deny"
# ...except path-only dependencies. Sibling-crate dev-deps are
# deliberately `path`-only WITHOUT a version (#1758): cargo strips
# versionless dev-deps at publish, so they can never bind to a
# published version — but cargo-deny models them as wildcards.
allow-wildcard-paths = true
highlight = "all"

# Crates we never want to depend on, even transitively. We use rustls
# everywhere (e.g. `ureq` is wired to rustls in our deps). Denying
# native-tls and openssl makes any accidental pull-through fail CI loudly
# instead of silently shipping a different TLS stack — a vector for
# platform-specific build breakage (system openssl-dev required) and a
# different threat surface than the rest of the workspace.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

# Current unavoidable duplicates. These are upstream version skews (mostly
# the wasmtime/cranelift stack pulling different versions of small util
# crates). Each entry is documented in passing — when the duplicate goes
# away (upstream aligns), the entry can be removed. cargo-deny will fail
# if a skipped crate no longer has multiple versions.
#
# Audited 2026-05 via `cargo deny check bans`.
skip = [
  { crate = "addr2line" },        # gimli's, vs backtrace's
  { crate = "bitflags" },         # 1.x via wasmtime stack, 2.x elsewhere
  { crate = "block-buffer" },     # digest 0.9 vs 0.10
  { crate = "cpufeatures" },      # transitive sha2 skew
  { crate = "crypto-common" },    # digest 0.9 vs 0.10
  { crate = "digest" },           # 0.9 vs 0.10 in the tree
  { crate = "equator" },          # ferrolearn-core/faer drag 3 versions (0.2/0.4/0.6)
  { crate = "equator-macro" },    # paired with equator
  { crate = "foldhash" },         # hashbrown skew
  { crate = "getrandom" },        # 0.2 (via ring/rustls/ureq TLS stack) vs 0.3 vs 0.4
  { crate = "gimli" },            # addr2line / object skew
  { crate = "hashbrown" },        # 3 versions: stdlib's, wasmtime's, our deps
  { crate = "io-lifetimes" },     # wasmtime 47 (cap-std 4.x) drags a 2nd version
  { crate = "linux-raw-sys" },    # rustix skew
  { crate = "object" },           # backtrace vs gimli
  { crate = "rand" },             # 0.8 (num-complex via faer/ferrolearn-bayes) vs 0.9 (faer's own) vs 0.10 (wasmtime 45 stack)
  { crate = "rand_core" },        # paired with rand — 0.6 vs 0.9 vs 0.10 same skew
  { crate = "rustc-hash" },       # rowan depends directly on 1.x; workspace is 2.x
  { crate = "rustix" },           # 0.38 vs 1.x
  { crate = "sha2" },             # 0.9 vs 0.10
  { crate = "syn" },              # 1.x (proc-macro ecosystem legacy) vs 2.x
  { crate = "thiserror" },        # 1.x vs 2.x — workspace is 2.x; transitives drag 1.x
  { crate = "thiserror-impl" },   # paired with thiserror
  { crate = "toml" },             # wasmtime cache vs our config parsing
  { crate = "toml_datetime" },    # paired with toml
  { crate = "unicode-width" },    # transitive skew
  { crate = "wasm-encoder" },     # wasmtime stack versioning
  { crate = "wasmparser" },       # wit-bindgen 0.239 (ffi-component #1384) vs wasmtime 0.248
  { crate = "wast" },             # wasmtime stack versioning
  { crate = "wit-parser" },       # wit-bindgen 0.239 (ffi-component #1384) vs wasmtime 0.248
  { crate = "winnow" },           # toml parser version skew
]

# Skip entire dependency trees
skip-tree = []

[sources]
unknown-registry = "deny"
# Forbid shadow git deps. Every git dep should be explicitly approved here.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
