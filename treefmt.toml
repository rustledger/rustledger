# treefmt configuration
# https://github.com/numtide/treefmt
# This file is for standalone treefmt usage outside of Nix

[global]
excludes = [
  "target/*",
  "result/*",
  ".direnv/*",
  "tests/fixtures/lima-tests/*",
  "tests/fixtures/examples/*",
  "*.lock",
]

[formatter.nix]
command = "nixpkgs-fmt"
includes = ["*.nix"]

[formatter.rust]
command = "cargo"
options = ["fmt", "--"]
includes = ["*.rs"]

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.markdown]
command = "mdformat"
includes = ["*.md"]
# SKILL.md: mdformat has no frontmatter support and would flatten an agent
# skill's YAML header into a heading (#3009).
excludes = ["CHANGELOG.md", "skills/*/SKILL.md"]

[formatter.shell]
command = "shfmt"
options = ["-i", "2", "-s", "-w"]
includes = ["*.sh"]

[formatter.yaml]
command = "yamlfmt"
includes = ["*.yaml", "*.yml"]
